name: Apply Home summary card alignment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/align-transaction-summary-home-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Home card alignment
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('src/routes/transactions.tsx'); s=p.read_text(); s=s.replace('      <section className=\"-mx-1 grid grid-cols-2 gap-2\">','      <section className=\"grid grid-cols-2 gap-2\">',1); s=s.replace('interactive-button rounded-xl border bg-card p-3 text-left transition-all','rounded-xl border bg-card p-3 text-left',2); s=s.replace('border-primary/60 ring-1 ring-primary/30','border-border/30 ring-1 ring-primary/30',1); s=s.replace('border-destructive/60 ring-1 ring-destructive/30','border-border/30 ring-1 ring-destructive/30',1); p.write_text(s)"

      - name: Verify changes
        shell: bash
        run: |
          grep -q '<section className="grid grid-cols-2 gap-2">' src/routes/transactions.tsx
          grep -q 'border-border/30 ring-1 ring-primary/30' src/routes/transactions.tsx
          grep -q 'border-border/30 ring-1 ring-destructive/30' src/routes/transactions.tsx
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/align-transaction-summary-home-v2.yml
          rm -f .github/workflows/align-transaction-summary-home.yml
          rm -f .github/workflows/align-transaction-month-summary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/routes/transactions.tsx .github/workflows
          git commit -m 'style: match transaction summary cards to Home'
          git push
