name: hotfix-current-balance-date
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hotfix-current-balance-date.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch current balances
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          home = Path("src/routes/home.tsx")
          text = home.read_text()
          old = '''        for (const tx of rawTx) {
          if (tx.is_visible === false || !tx.bank_account_id) continue;
          if (tx.type === "expense" && tx.card) continue;
          const amount = Number(tx.amount || 0);'''
          new = '''        const today = new Date();
        today.setHours(23, 59, 59, 999);
        for (const tx of rawTx) {
          if (tx.is_visible === false || !tx.bank_account_id) continue;
          if (tx.type === "expense" && tx.card) continue;
          const transactionDate = safeDate(tx.date);
          if (transactionDate && transactionDate > today) continue;
          const amount = Number(tx.amount || 0);'''
          if old not in text:
              raise SystemExit("home marker not found")
          home.write_text(text.replace(old, new, 1))

          accounts = Path("src/routes/accounts.tsx")
          text = accounts.read_text()
          old_select = '.select("bank_account_id, amount, type, is_visible, card")'
          new_select = '.select("bank_account_id, amount, type, is_visible, card, date")'
          if old_select not in text:
              raise SystemExit("accounts select marker not found")
          text = text.replace(old_select, new_select, 1)

          old_loop = '''        for (const tx of txData) {
          if (tx.is_visible === false) continue; // ignora transações ocultas/removidas logicamente
          const id = tx.bank_account_id as string;'''
          new_loop = '''        const todayKey = new Date().toLocaleDateString("en-CA");
        for (const tx of txData) {
          if (tx.is_visible === false) continue; // ignora transações ocultas/removidas logicamente
          const transactionDateKey = typeof tx.date === "string" ? tx.date.slice(0, 10) : undefined;
          if (transactionDateKey && transactionDateKey > todayKey) continue;
          const id = tx.bank_account_id as string;'''
          if old_loop not in text:
              raise SystemExit("accounts loop marker not found")
          accounts.write_text(text.replace(old_loop, new_loop, 1))
          PY
      - name: Commit result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/home.tsx src/routes/accounts.tsx
          git commit -m "fix: exclude future transactions from current balances"
          git push
