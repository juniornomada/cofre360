name: Apply monthly navigation
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hotfix-current-balance-date.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply month navigation patch
        run: python3 scripts/patch_month_navigation.py
      - name: Verify generated source
        run: |
          python3 -m py_compile scripts/patch_month_navigation.py
          grep -q 'selectedMonthLabel' src/routes/transactions.tsx
          grep -q 'matchesMonth' src/routes/transactions.tsx
          grep -q 'monthIncomeByAccount' src/routes/accounts.tsx
          grep -q 'Saldo por mês' src/routes/accounts.tsx
          grep -q 'month: selectedMonthKey' src/routes/accounts.tsx
          git diff --check
      - name: Commit functional changes and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/transactions.tsx src/routes/accounts.tsx
          git commit -m "feat: add monthly navigation for balances and transactions"
          git rm scripts/patch_month_navigation.py
          git rm .github/workflows/hotfix-current-balance-date.yml
          git commit -m "chore: remove monthly navigation patch workflow"
          git push origin main
