name: Patch deterministic Insights answers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic Insights patch
        run: python .github/scripts/patch_insights_deterministic.py
      - name: Commit patch and clean temporary files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/scripts/patch_insights_deterministic.py .github/workflows/patch-insights-deterministic.yml
          git add supabase/functions/financial-chat/index.ts
          git commit -m "fix: make Insights monthly totals deterministic"
          git push
