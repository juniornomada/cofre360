name: Allow negative account balance
on:
  push:
    paths:
      - .github/scripts/allow-negative-account-balance.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python3 .github/scripts/allow-negative-account-balance.py
      - name: Verify rule
        run: |
          ! grep -F 'Saldo insuficiente na conta' src/components/QuickAddTransactionDialog.tsx
          grep -F 'Expenses may intentionally leave the selected account with a negative balance.' src/components/QuickAddTransactionDialog.tsx
          grep -F 'Transfers may intentionally leave the source account with a negative balance.' src/components/QuickAddTransactionDialog.tsx
          git diff --check
      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Cleanup and commit
        run: |
          rm .github/scripts/allow-negative-account-balance.py
          rm .github/workflows/allow-negative-account-balance.yml
          rm -f .github/workflows/verify-account-hierarchy-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: allow account balances to go negative'
          git push
