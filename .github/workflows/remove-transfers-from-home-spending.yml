name: Remove transfers from Home spending

on:
  push:
    paths:
      - "scripts/remove-transfers-from-home-spending.py"
      - ".github/workflows/remove-transfers-from-home-spending.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python scripts/remove-transfers-from-home-spending.py
      - name: Verify source
        run: |
          grep -n 'mainCategory === "Transferência"' src/routes/home.tsx
          git diff --check
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/remove-transfers-from-home-spending.py
          rm .github/workflows/remove-transfers-from-home-spending.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: exclude transfers from monthly spending chart"
          git push
