name: Edit transfer accounts
on:
  push:
    paths:
      - '.github/workflows/edit-transfer-accounts.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python3 .github/scripts/edit-transfer-accounts.py
      - name: Verify source
        run: |
          grep -F 'Transferência atualizada' src/routes/transactions.tsx
          grep -F 'De (origem)' src/routes/transactions.tsx
          grep -F 'Para (destino)' src/routes/transactions.tsx
          ! grep -F 'validateEditedExpenseBalance' src/routes/transactions.tsx
          git diff --check
      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Cleanup and commit
        run: |
          rm -f .github/scripts/edit-transfer-accounts.py .github/workflows/edit-transfer-accounts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: edit transfer origin and destination accounts'
          git push
