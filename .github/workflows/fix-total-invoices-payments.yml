name: Fix total invoices payment deduction
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix consolidated invoice total
        shell: bash
        run: |
          python3 -c "from pathlib import Path; import base64; p=Path('src/routes/cards.tsx'); s=p.read_text(); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert old in s, 'invoice total anchor not found'; p.write_text(s.replace(old,new,1))"
      - name: Verify patch
        shell: bash
        run: |
          git diff --check
          grep -F 'const remainingCurrentAndFuture = (card: CardData)' src/routes/cards.tsx
          grep -F 'const totalAvailable = totalLimit - totalAllInvoices;' src/routes/cards.tsx
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-total-invoices-payments.yml
          git add src/routes/cards.tsx
          git commit -m 'fix: deduct invoice payments from consolidated total'
          git push