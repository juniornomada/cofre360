name: Restore QuickAdd installment steppers

on:
  push:
    paths:
      - "scripts/restore-quickadd-installment-steppers.py"
      - ".github/workflows/restore-quickadd-installment-steppers.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python scripts/restore-quickadd-installment-steppers.py
      - name: Verify source
        run: |
          grep -n 'Diminuir total de parcelas' src/components/QuickAddTransactionDialog.tsx
          grep -n 'Aumentar total de parcelas' src/components/QuickAddTransactionDialog.tsx
          grep -n 'Diminuir parcela atual' src/components/QuickAddTransactionDialog.tsx
          grep -n 'Aumentar parcela atual' src/components/QuickAddTransactionDialog.tsx
          grep -n 'Lançamento retroativo' src/components/QuickAddTransactionDialog.tsx
          ! grep -q 'Ou digite outro valor' src/components/QuickAddTransactionDialog.tsx
          git diff --check
      - name: Targeted installment tests
        run: bunx vitest run src/tests/quickadd-preview-matches-handleadd.integration.test.ts src/tests/quickadd-installment-start-validation.integration.test.tsx
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/restore-quickadd-installment-steppers.py
          rm .github/workflows/restore-quickadd-installment-steppers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: restore practical card installment controls"
          git push
