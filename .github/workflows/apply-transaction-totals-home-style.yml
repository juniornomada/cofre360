name: Apply transaction totals Home style

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Patch transaction totals cards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/routes/transactions.tsx")
          lines = p.read_text().splitlines()

          income_idx = next(i for i, line in enumerate(lines) if "Receitas · {selectedMonthLabel.split" in line)
          expense_idx = next(i for i, line in enumerate(lines) if "Despesas · {selectedMonthLabel.split" in line and i > income_idx)

          wrapper_idx = next(i for i in range(income_idx, -1, -1) if lines[i].strip() == '<div className="grid grid-cols-2 gap-2">')
          lines[wrapper_idx] = '      <section className="-mx-1 grid grid-cols-2 gap-2">'

          income_value_idx = next(i for i in range(income_idx, expense_idx) if "formatCurrency(totalIncome)" in lines[i])
          lines[income_value_idx] = '          <p className="mt-1 text-base font-bold text-primary">{balanceVisible ? `R$ ${formatCurrency(totalIncome)}` : "R$ ••••"}</p>'

          expense_value_idx = next(i for i in range(expense_idx, len(lines)) if "formatCurrency(totalExpense)" in lines[i])
          lines[expense_value_idx] = '          <p className="mt-1 text-base font-bold text-destructive">{balanceVisible ? `R$ ${formatCurrency(totalExpense)}` : "R$ ••••"}</p>'

          wrapper_close_idx = next(i for i in range(expense_value_idx + 1, len(lines)) if lines[i] == "      </div>")
          lines[wrapper_close_idx] = "      </section>"

          p.write_text("\n".join(lines) + "\n")
          PY
      - name: Validate touched file
        run: |
          set +e
          bun run typecheck > /tmp/typecheck.log 2>&1
          if grep -q "src/routes/transactions.tsx" /tmp/typecheck.log; then
            cat /tmp/typecheck.log
            exit 1
          fi
          exit 0
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-transaction-totals-home-style.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/transactions.tsx .github/workflows/apply-transaction-totals-home-style.yml
          git commit -m "style: match transaction totals cards to Home"
          git push
