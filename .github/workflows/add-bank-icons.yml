name: Add bank icons

on:
  push:
    paths:
      - 'scripts/patch_bank_logos.py'
      - '.github/workflows/add-bank-icons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python scripts/patch_bank_logos.py
      - name: Verify source
        run: |
          grep -q 'id: "porto", label: "Porto Bank"' src/components/BankLogo.tsx
          grep -q 'id: "caixacacr", label: "Caixa CA CR"' src/components/BankLogo.tsx
          grep -q 'label: "Caixa Econômica Federal"' src/components/BankLogo.tsx
          git diff --check
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/patch_bank_logos.py .github/workflows/add-bank-icons.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Porto Bank and Caixa CA CR account icons'
          git push
