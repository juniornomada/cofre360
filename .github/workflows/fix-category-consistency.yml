name: Refine investment allocation legend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-category-consistency.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Keep only percentage in allocation legend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/invest.tsx')
          text = path.read_text()
          old = '{balanceVisible ? `${pct.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 })}% · ${fmtBRL(d.value)}` : "••••"}'
          new = '{balanceVisible ? `${pct.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 })}%` : "••••"}'
          if old not in text:
              raise SystemExit('Investment allocation legend marker not found; source changed and was not patched.')
          path.write_text(text.replace(old, new, 1))
          PY

          grep -q 'maximumFractionDigits: 1 })}%` : "••••"' src/routes/invest.tsx

      - name: Commit result
        shell: bash
        run: |
          rm .github/workflows/fix-category-consistency.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: simplify investment allocation legend"
          git push
