name: Rename IR IOF category
on:
  push:
    paths:
      - '.github/workflows/rename-ir-iof-category.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python .github/scripts/rename-ir-iof-category.py
      - name: Verify source
        run: |
          grep -q 'label: "IR/IOF"' src/lib/categories.ts
          grep -q 'Impostos/Taxas > IR/IOF' src/lib/account-yield.ts
          grep -q 'Compatibilidade com lançamentos antigos' src/lib/categories.ts
          git diff --check
      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Cleanup and commit
        run: |
          rm -f .github/scripts/rename-ir-iof-category.py .github/workflows/rename-ir-iof-category.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: rename IR category to IR IOF'
          git push
