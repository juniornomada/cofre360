name: Restore transaction summary filter cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-transaction-summary-filter.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply summary card filter patch
        run: |
          echo '' | base64 -d | gzip -d | python3
      - name: Verify patch
        run: |
          grep -q 'const filteredWithoutType = transactions.filter' src/routes/transactions.tsx
          grep -q 'resumo original + filtro ao tocar' src/routes/transactions.tsx
          grep -q 'formatCurrency(totalIncome)' src/routes/transactions.tsx
          grep -q 'formatCurrency(totalExpense)' src/routes/transactions.tsx
          git diff --check
      - name: Commit changes
        run: |
          rm .github/workflows/restore-transaction-summary-filter.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/transactions.tsx .github/workflows/restore-transaction-summary-filter.yml
          git commit -m 'fix: restore transaction summary cards as filters'
          git push
