name: Apply adjustment date format
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-balance-date-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply date format patch
        run: python3 scripts/patch_adjustment_date_format.py
      - name: Verify automatic transaction date formats
        run: |
          ! grep -R 'date: new Date().toLocaleDateString("en-CA")' src/routes src/components src/lib
          grep -q 'date: format(new Date(), "dd MMM", { locale: ptBR })' src/routes/accounts.tsx
      - name: Commit patch and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/accounts.tsx
          git rm scripts/patch_adjustment_date_format.py
          git rm .github/workflows/hotfix-balance-date-v2.yml
          git commit -m 'fix: standardize automatic transaction date format'
          git push origin main
