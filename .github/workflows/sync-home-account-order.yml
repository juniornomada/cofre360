name: Sync Home account order

on:
  push:
    paths:
      - '.github/scripts/sync-home-account-order.py'
      - '.github/workflows/sync-home-account-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python .github/scripts/sync-home-account-order.py
      - name: Verify source
        run: |
          grep -q 'parent_account_id,sort_order' src/routes/home.tsx
          grep -q '.order("sort_order", { ascending: true })' src/routes/home.tsx
          git diff --check
      - name: Build
        run: bun install --frozen-lockfile && bun run build
      - name: Cleanup and commit
        run: |
          rm .github/scripts/sync-home-account-order.py
          rm .github/workflows/sync-home-account-order.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: match Home account order to Accounts'
          git push
