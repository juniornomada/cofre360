name: Unify invoice transaction editor

on:
  push:
    paths:
      - 'scripts/unify_invoice_transaction_edit.py'
      - '.github/workflows/unify-invoice-transaction-edit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python scripts/unify_invoice_transaction_edit.py
      - name: Verify source
        run: |
          grep -q 'data-testid="invoice-edit-installment"' src/routes/cards.tsx
          grep -q 'Parcela atual' src/routes/cards.tsx
          grep -q 'Total de parcelas' src/routes/cards.tsx
          ! grep -q 'onClick={() => openInstallmentDialog(tx)}' src/routes/cards.tsx
          git diff --check
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/unify_invoice_transaction_edit.py
          rm .github/workflows/unify-invoice-transaction-edit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: unify invoice transaction and installment editing'
          git push
