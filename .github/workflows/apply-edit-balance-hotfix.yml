name: Apply isolated installment edit patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch transaction installment edit scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/transactions.tsx')
          s=p.read_text()
          s=s.replace(
              'import { saveInstallmentPlan, stripInstallmentSuffix, detectInstallmentChanges, splitInstallmentChanges, propagateCosmeticFieldsToGroup } from "@/lib/installment-edit";',
              'import { saveInstallmentPlan, stripInstallmentSuffix, detectInstallmentChanges, propagateCosmeticFieldsToGroup } from "@/lib/installment-edit";'
          )
          old_scope = (
              "         const { structural } = splitInstallmentChanges(changes);\n"
              "         // Only ask about scope for structural changes (name/value/count/date).\n"
              "         // Cosmetic fields (category/icon/card/account) always propagate to the\n"
              "         // whole group automatically — they describe the purchase itself.\n"
              "         if (structural.length > 0) {\n"
              "           setScopeChanges(structural);\n"
              "           setShowUpdateScopeDialog(true);\n"
              "           return;\n"
              "         }"
          )
          new_scope = (
              "         // Any field can be edited only on the selected installment.\n"
              "         // Ask for scope whenever something changed so \"Apenas esta parcela\"\n"
              "         // is truly isolated for name, value, category, icon, date, card and account.\n"
              "         if (changes.length > 0) {\n"
              "           setScopeChanges(changes);\n"
              "           setShowUpdateScopeDialog(true);\n"
              "           return;\n"
              "         }"
          )
          if old_scope in s:
              s=s.replace(old_scope,new_scope)
          elif new_scope not in s:
              raise SystemExit('scope block not found')
          old_prop = (
              "      // Always propagate cosmetic fields (category/icon/card/account) to all\n"
              "      // siblings in the group — a purchase's category/card is a property of\n"
              "      // the whole plan, not of a single installment.\n"
              "      if (editTx.installment_group_id) {"
          )
          new_prop = (
              "      // Propagate cosmetic fields only when the user explicitly chose the\n"
              "      // entire installment group. \"Apenas esta parcela\" must stay isolated.\n"
              "      if (editTx.installment_group_id && updateScope === \"all\") {"
          )
          if old_prop in s:
              s=s.replace(old_prop,new_prop)
          elif new_prop not in s:
              raise SystemExit('propagation block not found')
          s=s.replace(
              'Você alterou uma transação parcelada. Deseja aplicar as alterações apenas nesta parcela ou em todas as demais? Categoria e ícone são propagados juntos quando você escolhe "Todas as parcelas do grupo".',
              'Você alterou uma transação parcelada. Escolha se a edição vale somente para esta parcela ou para todo o grupo. Em "Apenas esta parcela", nome, valor, categoria, ícone, data, cartão e conta ficam restritos ao lançamento selecionado.'
          )
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          git diff --check
          grep -F 'if (editTx.installment_group_id && updateScope === "all")' src/routes/transactions.tsx
          grep -F 'if (changes.length > 0)' src/routes/transactions.tsx
      - name: Commit patch and restore workflow files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git show HEAD^:.github/workflows/apply-edit-balance-hotfix.yml > .github/workflows/apply-edit-balance-hotfix.yml
          git rm -f .github/workflows/enable-single-installment-edit.yml || true
          git add src/routes/transactions.tsx .github/workflows/apply-edit-balance-hotfix.yml
          git commit -m "fix: allow isolated installment edits [single-installment-edit-applied]"
          git push