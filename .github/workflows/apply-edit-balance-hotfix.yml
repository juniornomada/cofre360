name: Apply edit balance hotfix
on:
  push:
    branches: [fix/edit-date-balance-validation]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[hotfix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch transaction edit validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/transactions.tsx')
          s=p.read_text()
          imp='import { validateEditedExpenseBalance } from "@/lib/transaction-balance-validation";\n'
          anchor='import { sanitizeTransactionName } from "@/lib/normalize-transaction-name";\n'
          if imp not in s:
              s=s.replace(anchor, anchor+imp)
          old='''          let availableBalance = acc.balance || 0;\n          \n          // If editing an existing expense from the same account, add back the current amount to check limit\n          if (originalTx && originalTx.bank_account_id === editTx.bank_account_id && originalTx.type === "expense") {\n            availableBalance += originalTx.amount;\n          }\n          \n          if (perInstallment > availableBalance) {\n            toast.error(`Saldo insuficiente na conta ${acc.name} (Saldo disponível: R$ ${availableBalance.toLocaleString("pt-BR", { minimumFractionDigits: 2 })})`);\n            return;\n          }'''
          new='''          const availableBalance = acc.balance || 0;\n\n          const balanceIsValid = !originalTx || validateEditedExpenseBalance({\n            originalAmount: originalTx.amount,\n            newAmount: perInstallment,\n            originalBankAccountId: originalTx.bank_account_id,\n            newBankAccountId: editTx.bank_account_id,\n            originalType: originalTx.type,\n            newType: editTx.type,\n            availableBalance,\n          });\n\n          if (!balanceIsValid) {\n            toast.error(`Saldo insuficiente na conta ${acc.name} (Saldo disponível: R$ ${availableBalance.toLocaleString("pt-BR", { minimumFractionDigits: 2 })})`);\n            return;\n          }'''
          if old not in s:
              raise SystemExit('old balance block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/transactions.tsx
          git commit -m "fix: wire balance validation into transaction edit [hotfix-applied]"
          git push