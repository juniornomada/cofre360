name: Invoice installment badge

on:
  push:
    paths:
      - "scripts/patch_invoice_installment_badge.py"
      - ".github/workflows/invoice-installment-badge.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python scripts/patch_invoice_installment_badge.py
      - name: Verify source
        run: |
          grep -n 'invoice-installment-badge' src/routes/cards.tsx
          git diff --check
      - name: Relevant tests
        run: bunx vitest run src/tests/cards-invoice-installment-badge.test.ts src/tests/cards-invoice-sort-guard.test.ts
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/patch_invoice_installment_badge.py
          rm .github/workflows/invoice-installment-badge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: keep installment count visible in invoice"
          git push
