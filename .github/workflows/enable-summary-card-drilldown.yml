name: Enable summary card drilldown

on:
  push:
    paths:
      - .github/workflows/enable-summary-card-drilldown.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Receitas/Despesas drilldown
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/routes/transactions.tsx")
          text = path.read_text()

          old_income = '          onClick={() => setFilterType(filterType === "income" ? "all" : "income")}\n'
          new_income = '''          onClick={() => {
            const nextType = filterType === "income" ? "all" : "income";
            setFilterType(nextType);
            if (nextType !== "all") {
              setActiveCategory("Todas");
              setActiveSource("all");
              setFilterAccountId(null);
              setFilterStartDate(undefined);
              setFilterEndDate(undefined);
              setFilterMinAmount("");
              setFilterMaxAmount("");
              setGlobalSearch("");
              setShowAdvancedFilters(false);
              localStorage.removeItem("transactions_filter_accountId");
              localStorage.setItem("transactions_filter_source", "all");
            }
          }}
'''

          old_expense = '          onClick={() => setFilterType(filterType === "expense" ? "all" : "expense")}\n'
          new_expense = '''          onClick={() => {
            const nextType = filterType === "expense" ? "all" : "expense";
            setFilterType(nextType);
            if (nextType !== "all") {
              setActiveCategory("Todas");
              setActiveSource("all");
              setFilterAccountId(null);
              setFilterStartDate(undefined);
              setFilterEndDate(undefined);
              setFilterMinAmount("");
              setFilterMaxAmount("");
              setGlobalSearch("");
              setShowAdvancedFilters(false);
              localStorage.removeItem("transactions_filter_accountId");
              localStorage.setItem("transactions_filter_source", "all");
            }
          }}
'''

          if old_income not in text:
            raise SystemExit("income summary click handler not found")
          if old_expense not in text:
            raise SystemExit("expense summary click handler not found")

          text = text.replace(old_income, new_income, 1)
          text = text.replace(old_expense, new_expense, 1)
          path.write_text(text)
          PY

      - name: Validate patch
        run: |
          git diff --check
          grep -F 'const nextType = filterType === "income" ? "all" : "income";' src/routes/transactions.tsx
          grep -F 'const nextType = filterType === "expense" ? "all" : "expense";' src/routes/transactions.tsx
          grep -F 'setActiveSource("all");' src/routes/transactions.tsx
          grep -F 'setFilterAccountId(null);' src/routes/transactions.tsx

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/enable-summary-card-drilldown.yml
          git add src/routes/transactions.tsx
          git commit -m "feat: drill down income expense summary cards"
          git push
