name: Fixed invoice dialog height

on:
  push:
    paths:
      - "scripts/patch_fixed_invoice_dialog_height.py"
      - ".github/workflows/fixed-invoice-dialog-height.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python scripts/patch_fixed_invoice_dialog_height.py
      - name: Verify source
        run: |
          grep -n 'h-\[85dvh\] max-h-\[85dvh\]' src/routes/cards.tsx
          grep -n 'overscroll-contain' src/routes/cards.tsx
          git diff --check
      - name: Relevant tests
        run: bunx vitest run src/tests/cards-invoice-sort-guard.test.ts
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/patch_fixed_invoice_dialog_height.py
          rm .github/workflows/fixed-invoice-dialog-height.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: keep invoice dialog height stable across months"
          git push
