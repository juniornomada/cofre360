name: Fix account yield calculation
on:
  push:
    paths:
      - scripts/fix-account-yield.py
      - .github/workflows/fix-account-yield.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python scripts/fix-account-yield.py
      - name: Verify source
        run: |
          grep -q 'yieldAmount={monthYieldByAccount' src/routes/accounts.tsx
          grep -q 'parsedCategory.sub === "Juros"' src/routes/accounts.tsx
          grep -q 'parsedCategory.sub === "IR"' src/routes/accounts.tsx
          grep -q 'parsedCategory.sub === "Taxas Bancárias"' src/routes/accounts.tsx
          grep -q 'iof' src/routes/accounts.tsx
          git diff --check
      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Cleanup and commit
        run: |
          rm -f scripts/fix-account-yield.py .github/workflows/fix-account-yield.yml
          git config user.name "cofre360-bot"
          git config user.email "110169607+juniornomada@users.noreply.github.com"
          git add -A
          git commit -m "fix: calculate subaccount yield from interest and fees"
          git push
