name: Audit displayed date formats
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[date-display-audit]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find potentially user-visible dates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in sorted(Path('src').rglob('*')):
              if p.suffix not in {'.ts', '.tsx'} or '.test.' in p.name or '__tests__' in p.parts or 'tests' in p.parts:
                  continue
              try:
                  lines = p.read_text(encoding='utf-8').splitlines()
              except Exception:
                  continue
              for i, line in enumerate(lines, 1):
                  low = line.lower()
                  if 'date' not in low and 'data' not in low:
                      continue
                  # Focus on presentation code / direct rendering / date formatting.
                  if any(tok in line for tok in ('{', 'format(', 'toLocaleDateString', 'placeholder=', 'Label', 'title=', 'aria-label')):
                      print(f'{p}:{i}: {line.strip()}')
          PY
