name: Fit debit account name

on:
  push:
    paths:
      - "scripts/fit-debit-account-name.py"
      - ".github/workflows/fit-debit-account-name.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python scripts/fit-debit-account-name.py
      - name: Verify source
        run: |
          grep -n "a.name.length > 13" src/components/QuickAddTransactionDialog.tsx
          git diff --check
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/fit-debit-account-name.py
          rm .github/workflows/fit-debit-account-name.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: fit long debit account names"
          git push
