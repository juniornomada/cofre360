name: Align transaction month summary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-transaction-month-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Match transaction summary to home
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/transactions.tsx')
          s = p.read_text()
          old = '''      <div className="grid grid-cols-2 gap-2">
        <div className="rounded-xl border border-border/30 bg-card p-3">
          <div className="flex items-center gap-1 text-[10px] font-semibold uppercase text-muted-foreground"><ArrowUpRight className="h-3.5 w-3.5 text-primary" />Receitas · {selectedMonthLabel.split(" ")[0]}</div>
          <p className="mt-1 text-base font-bold text-primary">R$ {formatCurrency(totalIncome)}</p>
        </div>
        <div className="rounded-xl border border-border/30 bg-card p-3">
          <div className="flex items-center gap-1 text-[10px] font-semibold uppercase text-muted-foreground"><ArrowDownRight className="h-3.5 w-3.5 text-destructive" />Despesas · {selectedMonthLabel.split(" ")[0]}</div>
          <p className="mt-1 text-base font-bold text-destructive">R$ {formatCurrency(totalExpense)}</p>
        </div>
      </div>'''
          new = '''      <section className="grid grid-cols-2 gap-2">
        <div className="min-w-0 rounded-xl border border-border/30 bg-card p-3">
          <div className="flex items-center gap-1 text-[10px] font-semibold uppercase text-muted-foreground"><ArrowUpRight className="h-3.5 w-3.5 shrink-0 text-primary" /><span className="truncate">Receitas · {selectedMonthLabel.split(" ")[0]}</span></div>
          <p className="mt-1 truncate text-base font-bold tabular-nums text-primary">{balanceVisible ? `R$ ${formatCurrency(totalIncome)}` : "R$ ••••"}</p>
        </div>
        <div className="min-w-0 rounded-xl border border-border/30 bg-card p-3">
          <div className="flex items-center gap-1 text-[10px] font-semibold uppercase text-muted-foreground"><ArrowDownRight className="h-3.5 w-3.5 shrink-0 text-destructive" /><span className="truncate">Despesas · {selectedMonthLabel.split(" ")[0]}</span></div>
          <p className="mt-1 truncate text-base font-bold tabular-nums text-destructive">{balanceVisible ? `R$ ${formatCurrency(totalExpense)}` : "R$ ••••"}</p>
        </div>
      </section>'''
          if old not in s:
              raise SystemExit('Expected monthly summary block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/transactions.tsx
          git commit -m "style: align transaction monthly totals with home"
          git rm .github/workflows/align-transaction-month-summary.yml
          git commit -m "chore: remove transaction summary patch workflow"
          git push origin main
