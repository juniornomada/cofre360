name: Fix yield responsive layout
on:
  push:
    paths:
      - 'scripts/fix-yield-responsive.py'
      - '.github/workflows/fix-yield-responsive.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python scripts/fix-yield-responsive.py
      - name: Verify source
        run: |
          grep -n 'whitespace-nowrap text-\[10px\] sm:text-\[11px\]' src/routes/accounts.tsx
          git diff --check
      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Cleanup and commit
        run: |
          rm -f scripts/fix-yield-responsive.py .github/workflows/fix-yield-responsive.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: keep account yield on one line'
          git push
