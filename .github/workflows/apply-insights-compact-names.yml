name: Apply grouped Insights IA installment layout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-insights-compact-names.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply grouped old-installment layout
        run: python .github/scripts/apply_insights_grouped_installments.py
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/FinancialChat.tsx supabase/functions/financial-chat/index.ts
          git commit -m "feat: group old installments by category"
          git push
