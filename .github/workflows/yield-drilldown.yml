name: Yield drilldown

on:
  push:
    paths:
      - scripts/patch-yield-drilldown.py
      - .github/workflows/yield-drilldown.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python scripts/patch-yield-drilldown.py
      - name: Verify source
        run: |
          grep -q 'isAccountYieldComponent' src/routes/transactions.tsx
          grep -q 'Composição do rendimento' src/routes/transactions.tsx
          grep -q 'Ver composição do rendimento' src/routes/accounts.tsx
          git diff --check
      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Cleanup and commit
        run: |
          rm -f scripts/patch-yield-drilldown.py .github/workflows/yield-drilldown.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: audit account yield components" || exit 0
          git push
