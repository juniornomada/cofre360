name: Highlight active summary filter

on:
  push:
    paths:
      - .github/workflows/highlight-summary-filter.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch active Receitas/Despesas styles
        shell: bash
        run: |
          echo '' | base64 -d | python3

      - name: Validate patch
        run: |
          git diff --check
          grep -F 'border-primary/60 bg-primary/10 ring-1 ring-primary/40 shadow-sm' src/routes/transactions.tsx
          grep -F 'border-destructive/60 bg-destructive/10 ring-1 ring-destructive/40 shadow-sm' src/routes/transactions.tsx

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/highlight-summary-filter.yml
          git add src/routes/transactions.tsx
          git commit -m "feat: highlight active income expense filters"
          git push
