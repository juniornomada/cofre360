name: Improve quick add input

on:
  push:
    paths:
      - '.github/workflows/improve-quick-add-input.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python3 scripts/improve-quick-add-input.py
      - name: Verify source
        run: |
          grep -q '{ label: "IR", icon: "🏛️" }' src/lib/categories.ts
          grep -q 'category: "Impostos/Taxas > IR"' src/lib/account-yield.ts
          grep -q 'Selecione uma conta ou um cartão' src/components/QuickAddTransactionDialog.tsx
          grep -q 'inputMode="decimal"' src/components/CalculatorAmountInput.tsx
          ! grep -q '>Nenhuma</span>' src/components/QuickAddTransactionDialog.tsx
          ! grep -q '>Nenhum</span>' src/components/QuickAddTransactionDialog.tsx
          git diff --check
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/improve-quick-add-input.py
          rm .github/workflows/improve-quick-add-input.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: improve quick add amount and payment selection'
          git push
