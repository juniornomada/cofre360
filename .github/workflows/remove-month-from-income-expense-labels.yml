name: Remove month from income expense labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-month-from-income-expense-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify labels on Home and Transactions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [Path('src/routes/home.tsx'), Path('src/routes/transactions.tsx')]
          replacements = {
              'Receitas · {selectedMonthLabel.split(" ")[0]}': 'Receitas',
              'Despesas · {selectedMonthLabel.split(" ")[0]}': 'Despesas',
          }
          for p in paths:
              s = p.read_text()
              for old, new in replacements.items():
                  if old not in s:
                      raise SystemExit(f'anchor not found in {p}: {old}')
                  s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Verify labels
        run: |
          grep -q '>Receitas</div>' src/routes/home.tsx
          grep -q '>Despesas</div>' src/routes/home.tsx
          grep -q '>Receitas</div>' src/routes/transactions.tsx
          grep -q '>Despesas</div>' src/routes/transactions.tsx
      - name: Remove one-shot workflow
        run: rm .github/workflows/remove-month-from-income-expense-labels.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/home.tsx src/routes/transactions.tsx .github/workflows/remove-month-from-income-expense-labels.yml
          git commit -m 'style: simplify income and expense labels'
          git push
