name: Fix invoice payment rounding
on:
  push:
    paths:
      - 'scripts/fix-invoice-payment-rounding.py'
      - '.github/workflows/fix-invoice-payment-rounding.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python scripts/fix-invoice-payment-rounding.py
      - name: Verify regression test
        run: bun test src/tests/invoice-payment-status.test.ts
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/fix-invoice-payment-rounding.py
          rm .github/workflows/fix-invoice-payment-rounding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: classify fully paid invoices in cents"
          git push
