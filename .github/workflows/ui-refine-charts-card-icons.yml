name: Refine chart cards and payment icons

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI refinements
        run: echo '' | base64 -d | python3
      - name: Verify changes
        run: |
          grep -q 'const onlyExpense' src/components/CategoryPieCharts.tsx
          grep -q 'renderChart(expenseData, "expense")' src/components/CategoryPieCharts.tsx
          grep -q 'size="xs"' src/routes/transactions.tsx
          grep -q 'gap-1.5 rounded-xl border p-2 text-left transition-all' src/routes/transactions.tsx
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/ui-refine-charts-card-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CategoryPieCharts.tsx src/routes/transactions.tsx .github/workflows/ui-refine-charts-card-icons.yml
          git commit -m "style: refine category charts and payment icons"
          git push
