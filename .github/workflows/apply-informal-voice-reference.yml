name: Apply informal voice references

on:
  push:
    branches:
      - main

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        env:
          PATCH_SCRIPT_B64: " nJw=="
        run: |
          echo "$PATCH_SCRIPT_B64" | base64 --decode | python3
      - name: Verify patch
        run: |
          git diff --check
          grep -F 'splitInformalReferenceFromName' src/lib/voice-transaction.ts
          grep -F 'entende referência informal no próprio nome' src/lib/__tests__/voice-transaction.test.ts
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-informal-voice-reference.yml
          git add src/lib/voice-transaction.ts src/lib/__tests__/voice-transaction.test.ts
          git commit -m "feat: understand informal voice references"
          git push
