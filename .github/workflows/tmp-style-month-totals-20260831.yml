name: Style monthly totals
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-style-month-totals-20260831.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch file
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/transactions.tsx')
          s=p.read_text()
          old_import='Search, Pencil, Trash2, Plus, CalendarIcon, Loader2, Upload, CheckSquare, Square, X, SlidersHorizontal, ArrowLeftRight, ArrowRight, Eye, EyeOff, FileText, MoreVertical, GripVertical, ArrowLeft, Landmark'
          new_import=old_import+', ArrowUpRight, ArrowDownRight'
          if old_import in s and 'ArrowUpRight' not in s.split('\n', 10)[5]: s=s.replace(old_import,new_import,1)
          old='''      <div className="grid grid-cols-2 gap-3">\n        <div className="rounded-xl bg-card p-3 text-left">\n          <p className="text-[10px] text-muted-foreground">Total receitas</p>\n          <p className="text-lg font-bold text-primary tabular-nums">R$ {formatCurrency(totalIncome)}</p>\n        </div>\n        <div className="rounded-xl bg-card p-3 text-right">\n          <p className="text-[10px] text-muted-foreground">Total despesas</p>\n          <p className="text-lg font-bold text-destructive tabular-nums">R$ {formatCurrency(totalExpense)}</p>\n        </div>\n      </div>'''
          new='''      <div className="grid grid-cols-2 gap-2">\n        <div className="rounded-xl border border-border/30 bg-card p-3">\n          <div className="flex items-center gap-1 text-[10px] font-semibold uppercase text-muted-foreground"><ArrowUpRight className="h-3.5 w-3.5 text-primary" />Receitas · {selectedMonthLabel.split(" ")[0]}</div>\n          <p className="mt-1 text-base font-bold tabular-nums text-primary">R$ {formatCurrency(totalIncome)}</p>\n        </div>\n        <div className="rounded-xl border border-border/30 bg-card p-3">\n          <div className="flex items-center gap-1 text-[10px] font-semibold uppercase text-muted-foreground"><ArrowDownRight className="h-3.5 w-3.5 text-destructive" />Despesas · {selectedMonthLabel.split(" ")[0]}</div>\n          <p className="mt-1 text-base font-bold tabular-nums text-destructive">R$ {formatCurrency(totalExpense)}</p>\n        </div>\n      </div>'''
          if old not in s: raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/transactions.tsx
          git commit -m 'style transaction monthly totals like home'
          git rm .github/workflows/tmp-style-month-totals-20260831.yml
          git rm -f .github/workflows/align-transaction-totals-with-home.yml || true
          git commit -m 'remove temporary totals workflows'
          git push origin main
