name: Replace opening balance with invested

on:
  push:
    paths:
      - '.github/scripts/replace-opening-balance-with-invested.py'
      - '.github/workflows/replace-opening-balance-with-invested.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python .github/scripts/replace-opening-balance-with-invested.py
      - name: Verify source
        run: |
          grep -F 'Investido:' src/routes/accounts.tsx
          ! grep -F 'Saldo inicial:' src/routes/accounts.tsx
          git diff --check
      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Cleanup and commit
        run: |
          rm -f .github/scripts/replace-opening-balance-with-invested.py
          rm -f .github/workflows/replace-opening-balance-with-invested.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: show invested principal on yield accounts'
          git push
