name: Carry pending refunds forward

on:
  push:
    branches:
      - main

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python3 .github/scripts/carry_pending_refunds_forward.py
      - name: Verify patch
        run: |
          git diff --check
          grep -F 'const carriedPendingRefunds = getCarriedPendingRefundsForPeriod(activePeriod);' src/routes/cards.tsx
          grep -F 'Reembolsos pendentes' src/routes/cards.tsx
          grep -F 'Não altera a fatura nem o limite até a confirmação.' src/routes/cards.tsx
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/carry-pending-refunds-forward.yml
          git rm .github/scripts/carry_pending_refunds_forward.py
          git add src/routes/cards.tsx
          git commit -m 'fix: carry pending refunds to the next invoice'
          git push
