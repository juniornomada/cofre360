name: Apply Home transaction category chip

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-home-transaction-category-chip.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align Home category chip with Transactions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/home.tsx')
          text = path.read_text()

          old_import = 'import { getCategoryIcon } from "@/lib/categories";'
          new_import = 'import { getCategoryDisplay, getCategoryIcon } from "@/lib/categories";'
          if old_import not in text and new_import not in text:
              raise SystemExit('categories import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_category = '<p className="truncate text-[10px] text-muted-foreground">{tx.category || "Sem categoria"}</p>'
          new_category = '''<span className="inline-flex max-w-[120px] truncate rounded bg-primary/10 px-1.5 py-0.5 text-[10px] font-bold text-primary">
                  {getCategoryDisplay(tx.category || "Sem categoria")}
                </span>'''
          if old_category not in text and new_category not in text:
              raise SystemExit('Home transaction category anchor not found')
          text = text.replace(old_category, new_category, 1)

          path.write_text(text)
          PY
          grep -q 'getCategoryDisplay, getCategoryIcon' src/routes/home.tsx
          grep -q 'getCategoryDisplay(tx.category || "Sem categoria")' src/routes/home.tsx
      - name: Commit result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/home.tsx
          git commit -m "feat: align Home transaction category chips"
          git push
