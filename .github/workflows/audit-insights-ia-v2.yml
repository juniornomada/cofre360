name: Audit and harden Insights IA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-insights-ia-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch suggestion lists
        run: python .github/scripts/audit_insights_patch.py || true
      - name: Patch backend and regression suite
        run: python .github/scripts/audit_insights_backend_patch.py
      - name: Validate patch
        run: |
          grep -q 'oldInstallmentDetails' supabase/functions/financial-chat/index.ts
          grep -q 'AUDITED_SUGGESTIONS' supabase/functions/financial-chat/index.ts
          grep -q 'NUNCA estime parcelas' supabase/functions/financial-chat/index.ts
          grep -q 'Follow-up contextual de alimentação' supabase/functions/run-ai-tests/index.ts
          grep -q 'Como estão minhas finanças este mês' src/routes/insights.tsx
      - name: Commit audited fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/insights.tsx src/components/FinancialChat.tsx supabase/functions/financial-chat/index.ts supabase/functions/run-ai-tests/index.ts
          git commit -m 'fix: audit and harden Insights IA financial answers'
          git push
