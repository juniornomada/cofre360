name: Audit Insights IA follow-up details
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-insights-ia-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Harden follow-up details
        run: python .github/scripts/audit_insights_followup_patch.py
      - name: Validate follow-up hardening
        run: |
          grep -q 'asksCategoryItemDetail' supabase/functions/financial-chat/index.ts
          grep -q 'currentEconomicItemLines' supabase/functions/financial-chat/index.ts
          grep -q 'chargeMonthStart' supabase/functions/financial-chat/index.ts
          grep -q 'outras despesas' supabase/functions/financial-chat/index.ts
      - name: Commit follow-up hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/financial-chat/index.ts
          git commit -m 'fix: harden Insights IA item-level follow-ups'
          git push
