name: Remove debit account hierarchy labels

on:
  push:
    paths:
      - "scripts/remove-debit-account-hierarchy-labels.py"
      - ".github/workflows/remove-debit-account-hierarchy-labels.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python scripts/remove-debit-account-hierarchy-labels.py
      - name: Verify source
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/components/QuickAddTransactionDialog.tsx').read_text()
          section = text.split('Conta Débito/Pix', 1)[1]
          first_block = section.split('</div>', 2)[0:2]
          print('Conta Débito/Pix updated')
          PY
          git diff --check
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/remove-debit-account-hierarchy-labels.py
          rm .github/workflows/remove-debit-account-hierarchy-labels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: simplify debit account selector labels"
          git push
