name: Patch Insights category line layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[insights-category-lines-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch category list markdown
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/financial-chat/index.ts')
          s = p.read_text()
          old = '? categories.slice(0, 12).map(([category, amount]) => `${categoryEmoji(category)} **${category} — R$ ${formatBRL(amount)}**`).join("\\n")'
          new = '? categories.slice(0, 12).map(([category, amount]) => `- ${categoryEmoji(category)} **${category} — R$ ${formatBRL(amount)}**`).join("\\n")'
          assert old in s, 'deterministic category list pattern not found'
          s = s.replace(old, new, 1)
          old_prompt = '- Em detalhamentos, prefira uma linha por categoria/subcategoria: "🛒 **Supermercado — R$ 758,03**".'
          new_prompt = '- Em detalhamentos, use lista Markdown com exatamente uma categoria/subcategoria por item e por linha, por exemplo: "- 🛒 **Supermercado — R$ 758,03**". Nunca coloque duas categorias na mesma linha.'
          assert old_prompt in s, 'prompt category layout pattern not found'
          s = s.replace(old_prompt, new_prompt, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/financial-chat/index.ts
          git commit -m "fix: render Insights categories one per line [insights-category-lines-applied]"
          git push
