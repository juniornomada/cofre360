name: Apply category spending layout
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-category-spending-layout.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move category spending and restore compact top four
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path('src/routes/home.tsx')
          s = home.read_text()

          old_import = 'import { cn } from "@/lib/utils";\n'
          new_import = 'import { cn } from "@/lib/utils";\nimport { getCategoryIcon } from "@/lib/categories";\n'
          if 'import { getCategoryIcon } from "@/lib/categories";' not in s:
              if old_import not in s:
                  raise SystemExit('home import anchor not found')
              s = s.replace(old_import, new_import, 1)

          heading = 'Gastos por categoria · {selectedMonthLabel.split(" ")[0]}'
          heading_pos = s.find(heading)
          if heading_pos == -1:
              raise SystemExit('home category heading not found')
          section_start = s.rfind('      <section className="rounded-2xl border border-border/30 bg-card p-3">', 0, heading_pos)
          if section_start == -1:
              raise SystemExit('home category section start not found')
          section_end = s.find('\n\n      <section>', heading_pos)
          if section_end == -1:
              raise SystemExit('home next section not found')

          compact = '''      {categorySpending.length > 0 && (\n        <section className="rounded-2xl border border-border/30 bg-card p-3">\n          <div className="grid grid-cols-4 gap-2">\n            {categorySpending.slice(0, 4).map((item) => (\n              <Link\n                key={item.category}\n                to="/transactions"\n                search={{ month: selectedMonthKey, category: item.category } as any}\n                aria-label={`${item.category}: R$ ${fmt(item.amount)}`}\n                title={item.category}\n                className="flex min-w-0 flex-col items-center justify-center gap-1 rounded-xl px-1 py-2 transition-colors hover:bg-accent/60"\n              >\n                <span className="text-2xl leading-none" aria-hidden="true">{getCategoryIcon(item.category)}</span>\n                <span className="max-w-full truncate text-[11px] font-bold tabular-nums text-foreground">\n                  {balanceVisible ? fmtCompact(item.amount) : "R$ ••••"}\n                </span>\n              </Link>\n            ))}\n          </div>\n        </section>\n      )}'''
          s = s[:section_start] + compact + s[section_end:]
          home.write_text(s)

          tx = Path('src/routes/transactions.tsx')
          t = tx.read_text()

          totals_anchor = '''  const totalIncome = filtered.filter(t => t.type === "income" && t.is_visible !== false).reduce((s, t) => s + t.amount, 0);\n  const totalExpense = filtered.filter(t => t.type === "expense" && t.is_visible !== false).reduce((s, t) => s + t.amount, 0);\n'''
          category_logic = '''  const totalIncome = filtered.filter(t => t.type === "income" && t.is_visible !== false).reduce((s, t) => s + t.amount, 0);\n  const totalExpense = filtered.filter(t => t.type === "expense" && t.is_visible !== false).reduce((s, t) => s + t.amount, 0);\n\n  const categorySpending = Object.entries(\n    transactions.reduce<Record<string, number>>((totals, tx) => {\n      if (tx.type !== "expense" || tx.is_visible === false) return totals;\n      const d = parseTxDate(tx.date, tx.created_at);\n      const timestamp = d?.getTime() ?? NaN;\n      if (!Number.isFinite(timestamp) || timestamp < selectedMonthStartUtc || timestamp > selectedMonthEndUtc) return totals;\n      const mainCategory = parseCategoryValue(tx.category).group || "Outros";\n      totals[mainCategory] = (totals[mainCategory] || 0) + Number(tx.amount || 0);\n      return totals;\n    }, {}),\n  )\n    .map(([category, amount]) => ({ category, amount }))\n    .filter((item) => item.amount > 0)\n    .sort((a, b) => b.amount - a.amount);\n\n  const categoryExpenseTotal = categorySpending.reduce((sum, item) => sum + item.amount, 0);\n\n  const formatCompactCurrency = (value: number) => {\n    if (Math.abs(value) < 1000) return `R$ ${formatCurrency(value)}`;\n    const compact = new Intl.NumberFormat("pt-BR", {\n      notation: "compact",\n      maximumFractionDigits: 1,\n    }).format(value).replace(/\\s*mil/i, " mil");\n    return `R$ ${compact}`;\n  };\n'''
          if 'const categorySpending = Object.entries(' not in t:
              if totals_anchor not in t:
                  raise SystemExit('transactions totals anchor not found')
              t = t.replace(totals_anchor, category_logic, 1)

          charts = '''      {/* Pie Charts */}\n      <div className="mt-8 mb-8">\n        <CategoryPieCharts\n          transactions={filtered}\n          formatCurrency={formatCurrency}\n          activeCategory={activeCategory}\n          onCategoryClick={(cat) => {\n            setActiveCategory(cat);\n            if (typeof window !== "undefined") {\n              window.scrollTo({ top: 0, behavior: "smooth" });\n            }\n          }}\n        />\n      </div>\n'''
          full_block = charts + '''\n      <section className="rounded-2xl border border-border/30 bg-card p-3">\n        <div className="mb-2 flex items-center justify-between">\n          <h2 className="text-xs font-semibold uppercase text-muted-foreground">Gastos por categoria · {selectedMonthLabel.split(" ")[0]}</h2>\n          <span className="text-[10px] text-muted-foreground">{categorySpending.length} categorias</span>\n        </div>\n        {categorySpending.length > 0 ? (\n          <div className="flex flex-col divide-y divide-border/20">\n            {categorySpending.map((item) => {\n              const share = categoryExpenseTotal > 0 ? Math.min(100, (item.amount / categoryExpenseTotal) * 100) : 0;\n              return (\n                <button\n                  key={item.category}\n                  type="button"\n                  onClick={() => {\n                    setActiveCategory(item.category);\n                    if (typeof window !== "undefined") window.scrollTo({ top: 0, behavior: "smooth" });\n                  }}\n                  className="flex w-full items-center gap-3 py-2.5 text-left first:pt-1 last:pb-1"\n                >\n                  <div className="min-w-0 flex-1">\n                    <div className="flex items-center justify-between gap-3">\n                      <span className="truncate text-xs font-medium text-foreground">{item.category}</span>\n                      <span className="shrink-0 text-xs font-bold tabular-nums text-foreground">\n                        {balanceVisible ? formatCompactCurrency(item.amount) : "R$ ••••"}\n                      </span>\n                    </div>\n                    <div className="mt-1.5 h-1.5 overflow-hidden rounded-full bg-accent">\n                      <div className="h-full rounded-full bg-destructive/70" style={{ width: `${share}%` }} />\n                    </div>\n                  </div>\n                </button>\n              );\n            })}\n          </div>\n        ) : (\n          <p className="py-3 text-center text-xs text-muted-foreground">Nenhuma despesa neste mês.</p>\n        )}\n      </section>\n'''
          if 'Gastos por categoria · {selectedMonthLabel.split(" ")[0]}' not in t:
              if charts not in t:
                  raise SystemExit('transactions charts anchor not found')
              t = t.replace(charts, full_block, 1)

          tx.write_text(t)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-category-spending-layout.yml
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/home.tsx src/routes/transactions.tsx .github/workflows/apply-category-spending-layout.yml
          git commit -m "feat: move category spending to transactions and restore top four"
          git push