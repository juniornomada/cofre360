name: Apply mobile transaction editor overflow fix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-mobile-edit-overflow.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile editor internal overflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/transactions.tsx')
          s = p.read_text()
          replacements = [
            ('<div className="flex-1 overflow-y-auto p-4 flex flex-col gap-4">', '<div className="flex-1 min-w-0 overflow-x-hidden overflow-y-auto p-4 flex flex-col gap-4">'),
            ('<div className="flex flex-col gap-4">\n              <div className="relative">', '<div className="flex min-w-0 flex-col gap-4">\n              <div className="relative min-w-0">'),
            ('<div className="flex gap-2">\n                  <button onClick={() => setEditTx({ ...editTx, type: "expense"', '<div className="grid min-w-0 grid-cols-2 gap-2">\n                  <button onClick={() => setEditTx({ ...editTx, type: "expense"'),
            ('className={`flex-1 rounded-xl py-2 text-xs font-medium transition-colors ${editTx.type === "expense"', 'className={`min-w-0 rounded-xl px-2 py-2 text-xs font-medium transition-colors ${editTx.type === "expense"'),
            ('className={`flex-1 rounded-xl py-2 text-xs font-medium transition-colors ${editTx.type === "income"', 'className={`min-w-0 rounded-xl px-2 py-2 text-xs font-medium transition-colors ${editTx.type === "income"'),
            ('<div className="flex gap-2">\n                  <button\n                    type="button"\n                    onClick={() => setEditTx({ ...editTx, bank_account_id: null', '<div className="grid min-w-0 grid-cols-2 gap-2">\n                  <button\n                    type="button"\n                    onClick={() => setEditTx({ ...editTx, bank_account_id: null'),
            ('className={`flex-1 rounded-xl py-2 text-xs font-medium transition-colors ${editTx.card ?', 'className={`min-w-0 rounded-xl px-2 py-2 text-[11px] leading-tight font-medium transition-colors ${editTx.card ?'),
            ('className={`flex-1 rounded-xl py-2 text-xs font-medium transition-colors ${editTx.bank_account_id ?', 'className={`min-w-0 rounded-xl px-2 py-2 text-[11px] leading-tight font-medium transition-colors ${editTx.bank_account_id ?'),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit('target not found: ' + old[:90])
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/hotfix-mobile-edit-overflow.yml
          git add src/routes/transactions.tsx
          git commit -m "fix: contain transaction editor content on mobile"
          git push
