name: Exact category spending totals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-exact-category-spending.yml'
      - '.github/scripts/fix_exact_category_spending.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply exact category spending patch
        run: python3 .github/scripts/fix_exact_category_spending.py
      - name: Validate touched TypeScript surfaces
        run: |
          set +e
          bun run typecheck 2>&1 | tee /tmp/typecheck.log
          status=${PIPESTATUS[0]}
          if grep -q 'src/routes/transactions.tsx' /tmp/typecheck.log; then exit 1; fi
          if grep -q 'src/lib/category-spending-ledger.ts' /tmp/typecheck.log; then exit 1; fi
          if grep 'src/routes/home.tsx' /tmp/typecheck.log | grep -v 'TS2345' >/tmp/home-unexpected.log; then cat /tmp/home-unexpected.log; exit 1; fi
          exit 0
      - name: Verify exact totals implementation
        run: |
          grep -q 'fetchAllCategoryLedgerTransactions' src/routes/transactions.tsx
          grep -q 'fetchAllCategoryLedgerTransactions' src/routes/home.tsx
          grep -q 'addCurrencyCents' src/routes/transactions.tsx
          ! grep -q 'formatCompactCurrency(item.amount)' src/routes/transactions.tsx
          ! grep -q 'fmtCompact(item.amount)' src/routes/home.tsx
      - name: Remove one-shot files
        run: rm .github/workflows/fix-exact-category-spending.yml .github/scripts/fix_exact_category_spending.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: calculate exact category spending from full ledger'
          git push
