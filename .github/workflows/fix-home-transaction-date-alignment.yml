name: Fix Home transaction date alignment

on:
  push:
    paths:
      - '.github/workflows/fix-home-transaction-date-alignment.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python3 scripts/fix-home-transaction-date-alignment.py
      - name: Verify source
        run: |
          grep -q 'mt-0.5 whitespace-nowrap text-\[10px\] text-muted-foreground' src/routes/home.tsx
          git diff --check
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/fix-home-transaction-date-alignment.py
          rm .github/workflows/fix-home-transaction-date-alignment.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore Home transaction date alignment'
          git push
