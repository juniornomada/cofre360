name: Sticky transactions month selector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sticky-transactions-month.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match Home sticky month selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/transactions.tsx')
          s = p.read_text()
          old = '<div className="flex items-center justify-between rounded-2xl border border-border/60 bg-card px-2 py-2 shadow-sm">'
          new = '<div className="sticky top-0 z-30 -mx-1 flex items-center justify-between rounded-2xl border border-border/50 bg-card/95 px-2 py-2 shadow-sm backdrop-blur supports-[backdrop-filter]:bg-card/85">'
          if old not in s:
              raise SystemExit('month selector anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify sticky selector
        run: grep -F 'sticky top-0 z-30 -mx-1 flex items-center justify-between rounded-2xl border border-border/50 bg-card/95' src/routes/transactions.tsx
      - name: Remove one-shot workflow
        run: rm .github/workflows/sticky-transactions-month.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/transactions.tsx .github/workflows/sticky-transactions-month.yml
          git commit -m 'style: keep transaction month selector sticky'
          git push
