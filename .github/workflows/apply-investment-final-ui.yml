name: Apply final investments allocation UI

on:
  push:
    branches: ["main"]

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch investments UI
        env:
          PATCH_SCRIPT_B64: 
        run: echo "$PATCH_SCRIPT_B64" | base64 -d | python3
      - name: Verify patch
        run: |
          git diff --check
          grep -F 'pos_fixado: "#FACC15"' src/routes/invest.tsx
          grep -F 'alternativos: "#A855F7"' src/routes/invest.tsx
          grep -F 'renda_variavel_global: "#EF4444"' src/routes/invest.tsx
          grep -F 'renda_variavel_brasil: "#06B6D4"' src/routes/invest.tsx
          grep -F 'backgroundColor: getAssetClassColor(inv.asset_class)' src/routes/invest.tsx
          ! grep -F 'PIE_COLORS' src/routes/invest.tsx
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-investment-final-ui.yml
          git add src/routes/invest.tsx
          git commit -m 'feat: finalize colored investment allocation UI'
          git push
