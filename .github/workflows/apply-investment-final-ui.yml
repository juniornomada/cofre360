name: Apply final investments allocation UI

on:
  push:
    branches: ["main"]

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch investments UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/routes/invest.tsx')
          s = p.read_text(encoding='utf-8')

          old_colors = '''const PIE_COLORS = [
            "hsl(var(--chart-1))",
            "hsl(var(--chart-2))",
            "hsl(var(--chart-3))",
            "hsl(var(--chart-4))",
            "hsl(var(--chart-5))",
            "hsl(var(--primary))",
          ];'''
          # Source indentation is top-level, normalize exact block without leading spaces.
          old_colors = old_colors.replace('          ', '')
          new_colors = '''const ASSET_CLASS_COLORS: Partial<Record<AssetClass, string>> = {
  pos_fixado: "#FACC15",
  alternativos: "#A855F7",
  renda_variavel_global: "#EF4444",
  renda_variavel_brasil: "#06B6D4",
  tesouro: "#EAB308",
  cdb: "#22C55E",
  cripto: "#F97316",
  acao: "#3B82F6",
  fii: "#14B8A6",
  etf: "#6366F1",
  outro: "#94A3B8",
};

const getAssetClassColor = (assetClass: string | null | undefined) =>
  ASSET_CLASS_COLORS[(assetClass || "outro") as AssetClass] || "#94A3B8";'''
          if old_colors not in s:
              raise SystemExit('PIE_COLORS block not found')
          s = s.replace(old_colors, new_colors, 1)

          old_pie = '''  // Pie data by asset_class
  const pieData = useMemo(() => {
    const map = new Map<string, number>();
    for (const { inv, val } of valuations) {
      const key = ASSET_CLASS_LABELS[(inv.asset_class || "outro") as AssetClass] || inv.type || "Outro";
      map.set(key, (map.get(key) || 0) + val.grossValue);
    }
    return Array.from(map, ([name, value]) => ({ name, value })).filter((d) => d.value > 0);
  }, [valuations]);'''
          new_pie = '''  // Pie data by asset_class. Colors are fixed per class so the visual identity never changes with ordering.
  const pieData = useMemo(() => {
    const map = new Map<string, { key: string; name: string; value: number; color: string }>();
    for (const { inv, val } of valuations) {
      const key = (inv.asset_class || "outro") as string;
      const name = ASSET_CLASS_LABELS[key as AssetClass] || inv.type || "Outro";
      const current = map.get(key);
      map.set(key, {
        key,
        name,
        value: (current?.value || 0) + val.grossValue,
        color: getAssetClassColor(key),
      });
    }
    return Array.from(map.values()).filter((d) => d.value > 0);
  }, [valuations]);'''
          if old_pie not in s:
              raise SystemExit('pieData block not found')
          s = s.replace(old_pie, new_pie, 1)

          graph_start = s.index('      {/* Gráfico de alocação */}')
          graph_end = s.index('      {/* Lista de investimentos */}', graph_start)
          new_graph = '''      {/* Gráfico de alocação */}
      {pieData.length > 0 && (
        <div className="rounded-2xl bg-card p-4">
          <h2 className="mb-2 text-sm font-semibold text-foreground">Alocação por classe</h2>
          <div className="relative h-52 w-full">
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie
                  data={pieData}
                  dataKey="value"
                  nameKey="name"
                  innerRadius={52}
                  outerRadius={82}
                  paddingAngle={2}
                  stroke="hsl(var(--card))"
                  strokeWidth={3}
                >
                  {pieData.map((d) => (
                    <Cell key={d.key} fill={d.color} />
                  ))}
                </Pie>
                <RTooltip
                  formatter={(v: any) => fmtBRL(Number(v))}
                  contentStyle={{ background: "hsl(var(--card))", border: "1px solid hsl(var(--border))", borderRadius: 8, fontSize: 12 }}
                />
              </PieChart>
            </ResponsiveContainer>
            <div className="pointer-events-none absolute inset-0 flex items-center justify-center">
              <div className="text-center">
                <p className="text-[9px] text-muted-foreground">Valor bruto</p>
                <p className="text-xs font-bold text-foreground tabular-nums">{fmtBRL(totalGross)}</p>
              </div>
            </div>
          </div>
          <div className="mt-1 grid grid-cols-2 gap-x-4 gap-y-2">
            {pieData.map((d) => {
              const pct = totalGross > 0 ? (d.value / totalGross) * 100 : 0;
              return (
                <div key={d.key} className="min-w-0">
                  <div className="flex items-center gap-1.5">
                    <span
                      className="h-2.5 w-2.5 shrink-0 rounded-full"
                      style={{ backgroundColor: d.color }}
                    />
                    <span className="min-w-0 truncate text-[10px] font-medium text-foreground" title={d.name}>
                      {d.name}
                    </span>
                  </div>
                  <div className="pl-4 text-[9px] font-semibold tabular-nums" style={{ color: d.color }}>
                    {pct.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 })}% · {fmtBRL(d.value)}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

'''
          s = s[:graph_start] + new_graph + s[graph_end:]

          old_class = '''          <p className="mt-0.5 truncate text-[9px] text-muted-foreground">
            {ASSET_CLASS_LABELS[(inv.asset_class as AssetClass) || "outro"] || inv.type}
            {inv.asset_code ? ` • ${inv.asset_code}` : ""}
          </p>'''
          new_class = '''          <div className="mt-0.5 flex min-w-0 items-center gap-1.5">
            <span
              className="h-2 w-2 shrink-0 rounded-full"
              style={{ backgroundColor: getAssetClassColor(inv.asset_class) }}
            />
            <p className="min-w-0 truncate text-[9px] text-muted-foreground">
              {ASSET_CLASS_LABELS[(inv.asset_class as AssetClass) || "outro"] || inv.type}
              {inv.asset_code ? ` • ${inv.asset_code}` : ""}
            </p>
          </div>'''
          if old_class not in s:
              raise SystemExit('asset class subtitle block not found')
          s = s.replace(old_class, new_class, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          git diff --check
          grep -F 'pos_fixado: "#FACC15"' src/routes/invest.tsx
          grep -F 'alternativos: "#A855F7"' src/routes/invest.tsx
          grep -F 'renda_variavel_global: "#EF4444"' src/routes/invest.tsx
          grep -F 'renda_variavel_brasil: "#06B6D4"' src/routes/invest.tsx
          grep -F 'Valor bruto' src/routes/invest.tsx
          grep -F 'backgroundColor: getAssetClassColor(inv.asset_class)' src/routes/invest.tsx
          ! grep -F 'PIE_COLORS' src/routes/invest.tsx
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-investment-final-ui.yml
          git add src/routes/invest.tsx
          git commit -m 'feat: finalize colored investment allocation UI'
          git push
