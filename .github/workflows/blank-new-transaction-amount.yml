name: Blank new transaction amount

on:
  push:
    paths:
      - "scripts/blank-new-transaction-amount.py"
      - ".github/workflows/blank-new-transaction-amount.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python scripts/blank-new-transaction-amount.py
      - name: Verify source
        run: |
          grep -n "blankWhenZero" src/components/CalculatorAmountInput.tsx src/components/QuickAddTransactionDialog.tsx
          grep -n "amount: 0," src/components/QuickAddTransactionDialog.tsx
          git diff --check
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/blank-new-transaction-amount.py
          rm .github/workflows/blank-new-transaction-amount.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: start new transactions with blank amount"
          git push
