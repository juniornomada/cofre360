name: Fix add selector and card opening invoice

on:
  push:
    paths:
      - "scripts/fix-add-selector-card-opening-invoice.py"
      - ".github/workflows/fix-add-selector-card-opening-invoice.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python scripts/fix-add-selector-card-opening-invoice.py
      - name: Verify source
        run: |
          grep -n "showAddTypeDialog" src/routes/transactions.tsx
          grep -n "includeOpeningInvoiceAmount" src/routes/cards.tsx
          grep -n "Fatura inicial" src/routes/cards.tsx
          git diff --check
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/fix-add-selector-card-opening-invoice.py
          rm .github/workflows/fix-add-selector-card-opening-invoice.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: restore add chooser and opening card invoice"
          git push
