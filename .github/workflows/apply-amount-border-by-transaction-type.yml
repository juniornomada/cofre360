name: Apply transaction date display format
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-amount-border-by-transaction-type.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply date display patch
        run: python3 scripts/patch_transaction_date_display.py
      - name: Commit patch and cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/transactions.tsx
          git rm scripts/patch_transaction_date_display.py
          git rm .github/workflows/apply-amount-border-by-transaction-type.yml
          git commit -m "fix: display transaction edit dates as dd-MM-yyyy"
          git push origin main
