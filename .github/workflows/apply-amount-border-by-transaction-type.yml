name: Apply amount border by transaction type
on:
  push:
    branches: [feat/debit-credit-installment-date-sync]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[amount-border-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch amount styles
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/QuickAddTransactionDialog.tsx')
          s = p.read_text()
          s = s.replace('className="!text-black dark:!text-white"', 'className="!text-black dark:!text-white !border-black dark:!border-white focus-visible:!ring-black dark:focus-visible:!ring-white"')
          s = s.replace('className={newTx.type === "expense" ? "!text-red-500" : "!text-green-600 dark:!text-green-500"}', 'className={newTx.type === "expense" ? "!text-red-500 !border-red-500 focus-visible:!ring-red-500" : "!text-green-600 dark:!text-green-500 !border-green-600 dark:!border-green-500 focus-visible:!ring-green-600 dark:focus-visible:!ring-green-500"}')
          p.write_text(s)

          t = Path('src/tests/quick-add-amount-color.test.ts')
          ts = t.read_text()
          ts = ts.replace('expect(source).toContain(\'newTx.type === "expense" ? "!text-red-500" : "!text-green-600 dark:!text-green-500"\');', 'expect(source).toContain(\'newTx.type === "expense" ? "!text-red-500 !border-red-500 focus-visible:!ring-red-500" : "!text-green-600 dark:!text-green-500 !border-green-600 dark:!border-green-500 focus-visible:!ring-green-600 dark:focus-visible:!ring-green-500"\');')
          ts = ts.replace('expect(source).toContain(\'className="!text-black dark:!text-white"\');', 'expect(source).toContain(\'className="!text-black dark:!text-white !border-black dark:!border-white focus-visible:!ring-black dark:focus-visible:!ring-white"\');')
          t.write_text(ts)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/QuickAddTransactionDialog.tsx src/tests/quick-add-amount-color.test.ts
          git commit -m "style: color amount border by transaction type [amount-border-applied]"
          git push
