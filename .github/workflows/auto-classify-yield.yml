name: Auto classify yield transactions
on:
  push:
    paths:
      - '.github/workflows/auto-classify-yield.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python .github/scripts/auto-classify-yield.py
      - name: Verify source
        run: |
          grep -q 'inferYieldTransactionFields' src/components/QuickAddTransactionDialog.tsx
          grep -q 'Impostos/Taxas > IOF' src/lib/account-yield.ts
          grep -q 'Math.abs(performance) >= 0.005' src/routes/accounts.tsx
          git diff --check
      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Cleanup and commit
        run: |
          rm -f .github/scripts/auto-classify-yield.py .github/workflows/auto-classify-yield.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: prevent yield transaction misclassification'
          git push
