name: Fix initial Home hierarchy

on:
  push:
    paths:
      - '.github/workflows/fix-initial-home-hierarchy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python3 scripts/fix-initial-home-hierarchy.py
      - name: Verify source
        run: |
          grep -q 'throw redirect({ to: "/home", replace: true })' src/routes/index.tsx
          grep -q "router.navigate({ to: '/home', replace: true })" src/routes/__root.tsx
          git diff --check
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/fix-initial-home-hierarchy.py
          rm .github/workflows/fix-initial-home-hierarchy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: use canonical Home on initial app load'
          git push
