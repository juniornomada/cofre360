name: Fix category drilldown filters

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch transactions drilldown
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("src/routes/transactions.tsx"); s=p.read_text(); old="  // Sync category from URL search param when it changes\n  useEffect(() => {\n    if (searchParams.category) setActiveCategory(searchParams.category);\n  }, [searchParams.category]);"; new="  // Category deep-links represent a drilldown of the full monthly category total.\n  // Clear persisted filters that could hide transactions included in that total.\n  useEffect(() => {\n    if (!searchParams.category) return;\n    setActiveCategory(searchParams.category);\n    setActiveSource(\"all\");\n    setFilterAccountId(null);\n    setFilterStartDate(undefined);\n    setFilterEndDate(undefined);\n    setFilterMinAmount(\"\");\n    setFilterMaxAmount(\"\");\n    setFilterType(\"all\");\n    localStorage.removeItem(\"transactions_filter_accountId\");\n    localStorage.setItem(\"transactions_filter_source\", \"all\");\n  }, [searchParams.category]);"; assert old in s, "category URL sync anchor not found"; s=s.replace(old,new,1); old2="                  onClick={() => {\n                    setActiveCategory(item.category);\n                    if (typeof window !== \"undefined\") window.scrollTo({ top: 0, behavior: \"smooth\" });\n                  }}"; new2="                  onClick={() => {\n                    clearAdvancedFilters();\n                    setActiveCategory(item.category);\n                    if (typeof window !== \"undefined\") window.scrollTo({ top: 0, behavior: \"smooth\" });\n                  }}"; assert old2 in s, "category spending drilldown anchor not found"; p.write_text(s.replace(old2,new2,1))'
      - name: Verify patch
        run: |
          grep -q 'Category deep-links represent a drilldown' src/routes/transactions.tsx
          grep -q 'clearAdvancedFilters();' src/routes/transactions.tsx
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/fix-category-drilldown-filters.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/transactions.tsx .github/workflows/fix-category-drilldown-filters.yml
          git commit -m 'fix: show transactions behind category totals'
          git push
