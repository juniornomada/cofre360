name: Apply category consistency 24.04
on:
  push:
    branches: [main]
    paths:
      - '.github/category-consistency-v3.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix_category_consistency.py
      - name: Verify patch
        run: |
          grep -q 'transactions={categoryChartTransactions}' src/routes/transactions.tsx
          grep -q 'const displayTotalExpense = categoryScopeActive' src/routes/transactions.tsx
      - name: Commit result
        run: |
          rm -f .github/category-consistency.trigger .github/category-consistency-v2.trigger .github/category-consistency-v3.trigger .github/scripts/fix_category_consistency.py .github/workflows/fix-category-consistency.yml .github/workflows/fix-category-consistency-run.yml .github/workflows/apply-category-consistency.yml .github/workflows/apply-category-consistency-2404.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: unify category spending totals across views"
          git push
