name: Apply purchase date BR format
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch display format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/cards.tsx')
          s = p.read_text()
          old = '''const getInvoicePurchaseDate = (tx: CardTransaction, allTransactions: CardTransaction[]): string | null => {
  if (tx.purchase_date) return tx.purchase_date;
  if (tx.installment_group_id) {
    const firstInstallment = allTransactions.find((row) =>
      row.installment_group_id === tx.installment_group_id &&
      Number(row.installment_number) === 1
    );
    return firstInstallment?.purchase_date || firstInstallment?.date || null;
  }
  return tx.date || null;
};'''
          new = '''const formatPurchaseDateBr = (value: string | null | undefined): string | null => {
  if (!value) return null;
  const raw = value.trim();
  const dmy = raw.match(/^(\\d{2})-(\\d{2})-(\\d{4})$/);
  if (dmy) return dmy[1] + "/" + dmy[2] + "/" + dmy[3];
  const iso = raw.match(/^(\\d{4})-(\\d{2})-(\\d{2})(?:T.*)?$/);
  if (iso) return iso[3] + "/" + iso[2] + "/" + iso[1];
  return raw;
};

const getInvoicePurchaseDate = (tx: CardTransaction, allTransactions: CardTransaction[]): string | null => {
  let value: string | null = tx.purchase_date || null;
  if (!value && tx.installment_group_id) {
    const firstInstallment = allTransactions.find((row) =>
      row.installment_group_id === tx.installment_group_id &&
      Number(row.installment_number) === 1
    );
    value = firstInstallment?.purchase_date || firstInstallment?.date || null;
  }
  if (!value && !tx.installment_group_id) value = tx.date || null;
  return formatPurchaseDateBr(value);
};'''
          if old not in s:
              raise SystemExit('purchase date helper anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify patch
        run: |
          git diff --check
          grep -F 'const formatPurchaseDateBr' src/routes/cards.tsx
          grep -F 'if (dmy) return dmy[1] + "/" + dmy[2] + "/" + dmy[3];' src/routes/cards.tsx
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-purchase-date-br-format.yml
          git add src/routes/cards.tsx
          git commit -m "fix: format purchase date as dd/mm/yyyy"
          git push