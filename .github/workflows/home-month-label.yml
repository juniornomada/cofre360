name: Align Home month label
on:
  push:
    paths:
      - '.github/workflows/home-month-label.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove de from Home month label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/home.tsx')
          text = p.read_text()
          old = '''  const selectedMonthLabel = new Intl.DateTimeFormat("pt-BR", { month: "long", year: "numeric" })\n    .format(selectedMonth)\n    .replace(/^./, (c) => c.toUpperCase());'''
          new = '''  const selectedMonthLabel = new Intl.DateTimeFormat("pt-BR", { month: "long", year: "numeric" })\n    .format(selectedMonth)\n    .replace(" de ", " ")\n    .replace(/^./, (c) => c.toUpperCase());'''
          if old not in text:
              raise SystemExit('Home month label target not found')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/home-month-label.yml
      - name: Verify
        run: |
          grep -F '.replace(" de ", " ")' src/routes/home.tsx
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/home.tsx .github/workflows/home-month-label.yml
          git commit -m 'style: match Home month label to Transactions'
          git push
