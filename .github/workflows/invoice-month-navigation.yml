name: Invoice Month Navigation
on:
  push:
    paths:
      - .github/workflows/invoice-month-navigation.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          rm .github/workflows/invoice-month-navigation.yml
      - name: Verify
        run: |
          grep -F 'invoiceReferenceDate' src/routes/cards.tsx
          grep -F 'Fatura do mês anterior' src/routes/cards.tsx
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/cards.tsx .github/workflows/invoice-month-navigation.yml
          git commit -m 'feat: navigate card invoices by month'
          git push
