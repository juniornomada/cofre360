name: CI - Typecheck, Schema-Versioning, Drift, Fuzz/Cycle, Label/Navigation & Preview Parity

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Job graph:
#
#   setup ─┬─► static      (no-wide-casts)
#          ├─► typecheck   (strict, no emit)
#          ├─► test-schema-drift
#          ├─► test-preview-parity
#          ├─► test-fuzz-cycle
#          ├─► test-label-navigation
#          ├─► test-full
#          ├─► supabase-auth-check
#          └─► build
#
# `setup` warms the Bun install cache once; every downstream job restores
# that same cache (identical key) and runs `bun install --frozen-lockfile`
# offline, so we pay the network cost at most once per SHA. All eight
# downstream jobs run in parallel — total wall time is now bounded by the
# slowest job (typically the full test suite) instead of their sum.
jobs:
  setup:
    name: Setup (warm Bun cache)
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Compute cache key
        id: cache-key
        run: echo "key=${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}" >> "$GITHUB_OUTPUT"

      # Cache do global store do Bun (~/.bun/install/cache) — populado
      # uma vez aqui e restaurado por todos os jobs a jusante.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  static:
    name: Static checks (no-wide-casts)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # Guarda estática: nenhum `as any` / `as InstallmentPreview` /
      # `as DriftMetric` / `<any>` pode reaparecer nas superfícies
      # críticas de schema-versioning e drift.
      - name: Check no wide casts (schema-versioning & drift surfaces)
        run: bun run check:no-wide-casts
      # Guarda de wording: descrições de pagamento de cartão devem seguir
      # o formato canônico "Pagamento {Parcial|Total} cartão <Nome>".
      # Falha o CI se a wording legada com "fatura" reaparecer em
      # qualquer arquivo do repo (código, migrations, seeds, docs) fora
      # do ALLOWLIST em scripts/check-payment-wording.mjs.
      - name: Check no legacy card-payment wording (repo + migrations + seeds)
        run: bun run check:payment-wording

  typecheck:
    name: Typecheck (strict, no emit)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck

  test-schema-drift:
    name: Tests · schema-versioning & drift
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Schema-versioning & drift test suite
        run: bun run test:schema-drift

  test-preview-parity:
    name: Tests · preview ↔ handleAdd parity (installments)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Preview parity suite
        run: bun run test:preview-parity

  test-fuzz-cycle:
    name: Tests · fuzz determinístico & cycle key gate
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Fuzz + cycle key gate
        run: bun run test:fuzz-cycle

  # Gate dedicado à wording canônica de pagamento de cartão e à navegação
  # entre faturas/telas que emitem esse rótulo. Falha o CI se:
  #   - qualquer teste da suíte de rótulo/navegação regredir;
  #   - qualquer arquivo de produção (fora do helper canônico e do módulo
  #     de saneamento) voltar a conter "Pagamento ... fatura cartão";
  #   - o rótulo for remontado inline com template literal em vez de
  #     `formatCardPaymentLabel`.
  # O `check:payment-wording` (job `static`) já roda como grep no repo
  # inteiro, mas aqui garantimos cobertura dinâmica: chamadas reais dos
  # handlers de pagamento, transições de período (fatura anterior/atual/
  # futura) e fluxos de "Adicionar transação" a partir do empty-state.
  test-label-navigation:
    name: Tests · rótulo de pagamento & navegação de faturas
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Label + navigation regression suite
        run: bun run test:label-navigation

  test-full:
    name: Tests · full suite (a11y, componentes, integração)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Full test suite (with coverage)
        run: bun run test:coverage

      # Resumo de cobertura (total + patch) publicado no Job Summary do
      # GitHub Actions. "Total" vem direto de coverage-summary.json;
      # "Patch" é calculado a partir dos arquivos alterados neste push/PR
      # (git diff contra base), agregando linhas cobertas/totais só desses
      # arquivos. Se não houver arquivos alterados sob cobertura, o patch
      # é reportado como N/A — nunca falha o job.
      - name: Coverage summary (total + patch)
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          # Precisamos de histórico para o diff patch
          git fetch --no-tags --depth=50 origin "${GITHUB_BASE_REF:-$GITHUB_REF_NAME}" 2>/dev/null || true
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const { execSync } = require('child_process');
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
          const total = summary.total;
          const pct = (m) => `${m.pct.toFixed(2)}% (${m.covered}/${m.total})`;

          // --- Patch coverage ---
          const base = process.env.BASE_SHA || process.env.EVENT_BEFORE || '';
          let changed = [];
          try {
            const range = base && base !== '0000000000000000000000000000000000000000'
              ? `${base}...HEAD`
              : 'HEAD~1...HEAD';
            const out = execSync(`git diff --name-only --diff-filter=AMR ${range}`, { encoding: 'utf8' });
            changed = out.split('\n').filter(f => /^src\/.+\.(ts|tsx)$/.test(f)
              && !/\.(test|spec)\.(ts|tsx)$/.test(f)
              && !f.startsWith('src/tests/')
              && !f.includes('__tests__/'));
          } catch (e) {
            changed = [];
          }

          let patchLine = 'N/A (sem arquivos cobertos alterados)';
          const patchDetails = [];
          if (changed.length) {
            let cov = 0, tot = 0;
            for (const file of changed) {
              // coverage-summary usa caminho absoluto ou relativo — tentamos ambos.
              const key = Object.keys(summary).find(k => k !== 'total' && (k.endsWith('/' + file) || k === file));
              if (!key) continue;
              const s = summary[key].lines;
              cov += s.covered;
              tot += s.total;
              patchDetails.push(`| \`${file}\` | ${s.pct.toFixed(2)}% | ${s.covered}/${s.total} |`);
            }
            if (tot > 0) {
              patchLine = `${((cov / tot) * 100).toFixed(2)}% (${cov}/${tot})`;
            }
          }

          const lines = [
            '## 📊 Cobertura de Testes',
            '',
            '| Métrica | Total | Patch |',
            '| --- | --- | --- |',
            `| Linhas | ${pct(total.lines)} | ${patchLine} |`,
            `| Statements | ${pct(total.statements)} | — |`,
            `| Branches | ${pct(total.branches)} | — |`,
            `| Funções | ${pct(total.functions)} | — |`,
            '',
          ];
          if (patchDetails.length) {
            lines.push('<details><summary>Arquivos do patch</summary>', '',
              '| Arquivo | Linhas % | Cobertas/Total |',
              '| --- | --- | --- |',
              ...patchDetails,
              '', '</details>', '');
          }
          console.log(lines.join('\n'));
          NODE



      # HTML/JSON como artifact para inspeção manual — 14 dias basta para
      # diagnóstico de regressão sem inflar o storage do repositório.
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
            coverage/index.html
            coverage/**/*.html
          retention-days: 14
          if-no-files-found: warn

      # Codecov upload — usa OIDC/tokenless para repos públicos; para
      # repos privados o usuário deve adicionar CODECOV_TOKEN como
      # repository secret. `fail_ci_if_error: false` garante que uma
      # indisponibilidade do Codecov nunca reprove o CI.
      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: cofre360-unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  supabase-auth-check:
    name: Supabase Auth security check (pre-deploy)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Supabase Auth check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SKIP_SUPABASE_AUTH_CHECK: ${{ secrets.SUPABASE_ACCESS_TOKEN == '' && '1' || '' }}
        run: node scripts/check-supabase-auth.mjs

  build:
    name: Build check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run build

  # Meta-job para simplificar a branch protection: exigir apenas `ci` como
  # required check em vez de listar cada job. Só passa se todos os jobs
  # necessários passarem (skipped/failed no upstream reprovam aqui).
  ci:
    name: CI
    if: always()
    runs-on: ubuntu-latest
    needs:
      - static
      - typecheck
      - test-schema-drift
      - test-preview-parity
      - test-fuzz-cycle
      - test-label-navigation
      - test-full
      - supabase-auth-check
      - build
    steps:
      - name: Aggregate job results
        run: |
          echo "Job results:"
          echo "  static:                ${{ needs.static.result }}"
          echo "  typecheck:             ${{ needs.typecheck.result }}"
          echo "  test-schema-drift:     ${{ needs.test-schema-drift.result }}"
          echo "  test-preview-parity:   ${{ needs.test-preview-parity.result }}"
          echo "  test-fuzz-cycle:       ${{ needs.test-fuzz-cycle.result }}"
          echo "  test-label-navigation: ${{ needs.test-label-navigation.result }}"
          echo "  test-full:             ${{ needs.test-full.result }}"
          echo "  supabase-auth-check:   ${{ needs.supabase-auth-check.result }}"
          echo "  build:                 ${{ needs.build.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more required jobs failed or were cancelled."
            exit 1
          fi
