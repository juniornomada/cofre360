name: CI - Typecheck, Schema-Versioning, Drift, Fuzz/Cycle & Preview Parity

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Job graph:
#
#   setup ─┬─► static      (no-wide-casts)
#          ├─► typecheck   (strict, no emit)
#          ├─► test-schema-drift
#          ├─► test-preview-parity
#          ├─► test-fuzz-cycle
#          ├─► test-full
#          ├─► supabase-auth-check
#          └─► build
#
# `setup` warms the Bun install cache once; every downstream job restores
# that same cache (identical key) and runs `bun install --frozen-lockfile`
# offline, so we pay the network cost at most once per SHA. All eight
# downstream jobs run in parallel — total wall time is now bounded by the
# slowest job (typically the full test suite) instead of their sum.
jobs:
  setup:
    name: Setup (warm Bun cache)
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Compute cache key
        id: cache-key
        run: echo "key=${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}" >> "$GITHUB_OUTPUT"

      # Cache do global store do Bun (~/.bun/install/cache) — populado
      # uma vez aqui e restaurado por todos os jobs a jusante.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  static:
    name: Static checks (no-wide-casts)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # Guarda estática: nenhum `as any` / `as InstallmentPreview` /
      # `as DriftMetric` / `<any>` pode reaparecer nas superfícies
      # críticas de schema-versioning e drift.
      - name: Check no wide casts (schema-versioning & drift surfaces)
        run: bun run check:no-wide-casts

  typecheck:
    name: Typecheck (strict, no emit)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck

  test-schema-drift:
    name: Tests · schema-versioning & drift
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Schema-versioning & drift test suite
        run: bun run test:schema-drift

  test-preview-parity:
    name: Tests · preview ↔ handleAdd parity (installments)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Preview parity suite
        run: bun run test:preview-parity

  test-fuzz-cycle:
    name: Tests · fuzz determinístico & cycle key gate
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Fuzz + cycle key gate
        run: bun run test:fuzz-cycle

  test-full:
    name: Tests · full suite (a11y, componentes, integração)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Full test suite (with coverage)
        run: bun run test:coverage

      # HTML/JSON como artifact para inspeção manual — 14 dias basta para
      # diagnóstico de regressão sem inflar o storage do repositório.
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
            coverage/index.html
            coverage/**/*.html
          retention-days: 14
          if-no-files-found: warn

      # Codecov upload — usa OIDC/tokenless para repos públicos; para
      # repos privados o usuário deve adicionar CODECOV_TOKEN como
      # repository secret. `fail_ci_if_error: false` garante que uma
      # indisponibilidade do Codecov nunca reprove o CI.
      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: cofre360-unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  supabase-auth-check:
    name: Supabase Auth security check (pre-deploy)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Supabase Auth check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SKIP_SUPABASE_AUTH_CHECK: ${{ secrets.SUPABASE_ACCESS_TOKEN == '' && '1' || '' }}
        run: node scripts/check-supabase-auth.mjs

  build:
    name: Build check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run build

  # Meta-job para simplificar a branch protection: exigir apenas `ci` como
  # required check em vez de listar cada job. Só passa se todos os jobs
  # necessários passarem (skipped/failed no upstream reprovam aqui).
  ci:
    name: CI
    if: always()
    runs-on: ubuntu-latest
    needs:
      - static
      - typecheck
      - test-schema-drift
      - test-preview-parity
      - test-fuzz-cycle
      - test-full
      - supabase-auth-check
      - build
    steps:
      - name: Aggregate job results
        run: |
          echo "Job results:"
          echo "  static:              ${{ needs.static.result }}"
          echo "  typecheck:           ${{ needs.typecheck.result }}"
          echo "  test-schema-drift:   ${{ needs.test-schema-drift.result }}"
          echo "  test-preview-parity: ${{ needs.test-preview-parity.result }}"
          echo "  test-fuzz-cycle:     ${{ needs.test-fuzz-cycle.result }}"
          echo "  test-full:           ${{ needs.test-full.result }}"
          echo "  supabase-auth-check: ${{ needs.supabase-auth-check.result }}"
          echo "  build:               ${{ needs.build.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more required jobs failed or were cancelled."
            exit 1
          fi
