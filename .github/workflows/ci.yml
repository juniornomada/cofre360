name: CI - Typecheck, Schema-Versioning, Drift, Fuzz/Cycle & Preview Parity

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # Cache do global store do Bun (~/.bun/install/cache) — reutiliza
      # tarballs entre runs, corta ~40-70% do tempo de `bun install`.
      # Chave: SO + hash do bun.lockb; fallback progressivo para o último
      # cache do mesmo SO quando o lockfile muda.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Guarda estática: nenhum `as any` / `as InstallmentPreview` /
      # `as DriftMetric` / `<any>` pode reaparecer nas superfícies
      # críticas de schema-versioning e drift.
      - name: Check no wide casts (schema-versioning & drift surfaces)
        run: bun run check:no-wide-casts

      # Typecheck estrito: pega TS2352 e afins antes dos testes.
      - name: Typecheck (strict, no emit)
        run: bun run typecheck

      # Suíte completa de schema-versioning + drift + mapper.
      # Executada isoladamente para retornar sinal rápido e log limpo.
      - name: Schema-versioning & drift test suite
        run: bun run test:schema-drift

      # Paridade prévia ↔ handleAdd do diálogo de nova transação parcelada.
      # Roda isolado em cada PR para bloquear regressões que dessincronizem
      # o "Valor por parcela" exibido dos valores efetivamente persistidos.
      - name: Preview ↔ handleAdd parity (installments)
        run: bun run test:preview-parity

      # Gate dedicado: qualquer regressão em fuzz determinístico do
      # parseTxDate (LCG-seeded, resiliência, property-based, boundary
      # de virada de ano, separadores) OU nos testes de cycle key
      # (grouping por ciclo, drift de fuso, dedupe, tolerância,
      # integração parser↔ciclo, year-rollover) trava o CI aqui —
      # antes da suíte completa — com log isolado.
      - name: Fuzz determinístico & cycle key gate
        run: bun run test:fuzz-cycle

      # Suíte completa restante (acessibilidade, componentes, integração).
      - name: Full test suite
        run: bun run test

      - name: Supabase Auth security check (pre-deploy)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SKIP_SUPABASE_AUTH_CHECK: ${{ secrets.SUPABASE_ACCESS_TOKEN == '' && '1' || '' }}
        run: node scripts/check-supabase-auth.mjs

      - name: Build check
        run: bun run build
