 name: CI - Accessibility & Tests
 
 on:
   push:
     branches: [ main ]
   pull_request:
     branches: [ main ]
 
 jobs:
   test:
     runs-on: ubuntu-latest
 
     steps:
       - uses: actions/checkout@v4
 
       - name: Install Bun
         uses: oven-sh/setup-bun@v2
 
       - name: Install dependencies
         run: bun install
 
      - name: Run Accessibility & Component Tests
         run: npm test
 
       - name: Supabase Auth security check (pre-deploy)
         env:
           SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
           SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
           SKIP_SUPABASE_AUTH_CHECK: ${{ secrets.SUPABASE_ACCESS_TOKEN == '' && '1' || '' }}
         run: node scripts/check-supabase-auth.mjs
 
       - name: Build check
         run: bun run build