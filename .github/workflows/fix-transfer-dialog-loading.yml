name: Fix transfer dialog loading
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make quick add eager
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = 'const QuickAddTransactionDialog = lazy(() => import("@/components/QuickAddTransactionDialog").then(m => ({ default: m.QuickAddTransactionDialog })));'
          new = 'import { QuickAddTransactionDialog } from "@/components/QuickAddTransactionDialog";'
          for name in ['src/routes/index.tsx', 'src/routes/transactions.tsx']:
              path = Path(name)
              text = path.read_text()
              if old not in text:
                  raise SystemExit('QuickAdd lazy import not found: ' + name)
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify
        run: |
          git diff --check
          grep -F 'import { QuickAddTransactionDialog } from "@/components/QuickAddTransactionDialog";' src/routes/index.tsx
          grep -F 'import { QuickAddTransactionDialog } from "@/components/QuickAddTransactionDialog";' src/routes/transactions.tsx
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-transfer-dialog-loading.yml
          git add src/routes/index.tsx src/routes/transactions.tsx
          git commit -m "fix: load transfer dialog with transaction pages"
          git push