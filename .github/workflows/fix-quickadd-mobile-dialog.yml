name: Fix quick add mobile dialog

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-quickadd-mobile-dialog.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Make quick-add dialog mobile-safe
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/QuickAddTransactionDialog.tsx')
          text = path.read_text()

          replacements = [
            (
              '<DialogContent className="w-[94vw] max-w-[94vw] sm:w-[28rem] sm:max-w-[28rem] rounded-2xl bg-background max-h-[92vh] min-h-[600px] sm:min-h-[640px] overflow-y-auto p-4 gap-2 flex flex-col">',
              '<DialogContent className="w-[calc(100dvw-24px)] max-w-[calc(100dvw-24px)] h-[calc(100dvh-24px)] max-h-[calc(100dvh-24px)] min-h-0 rounded-2xl bg-background overflow-hidden p-0 gap-0 flex flex-col sm:h-auto sm:max-h-[88dvh] sm:min-h-[640px] sm:w-[28rem] sm:max-w-[28rem]">'
            ),
            (
              '<DialogHeader className="space-y-0 pr-6">',
              '<DialogHeader className="shrink-0 space-y-0 border-b border-border/50 p-4 pb-3 pr-10">'
            ),
            (
              '<div className="flex flex-col gap-2.5">',
              '<div className="flex-1 min-h-0 overflow-y-auto overscroll-contain p-4 flex flex-col gap-2.5">'
            ),
            (
              '<DialogFooter className="mt-2 flex-row gap-2 sm:gap-2">',
              '<DialogFooter className="shrink-0 border-t border-border/50 bg-background p-4 pt-3 flex-row gap-2 sm:gap-2">'
            ),
            (
              'className="flex-1 h-8 text-xs" onClick={() => { (document.activeElement as HTMLElement)?.blur(); onOpenChange(false); }}',
              'className="flex-1 h-10 text-xs rounded-xl" onClick={() => { (document.activeElement as HTMLElement)?.blur(); onOpenChange(false); }}'
            ),
            (
              'className="flex-1 h-8 text-xs"\n            disabled=',
              'className="flex-1 h-10 text-xs rounded-xl"\n            disabled='
            ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:90]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/QuickAddTransactionDialog.tsx
          git diff --cached --check
          git commit -m "fix: keep quick-add dialog within mobile viewport"
          git push origin main
