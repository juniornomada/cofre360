name: Fix transactions storage init
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch storage access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/transactions.tsx')
          s = p.read_text()
          a = 'searchParams.accountId ? "account" : (localStorage.getItem("transactions_filter_source") as any || "all")'
          b = 'searchParams.accountId ? "account" : (((typeof window !== "undefined" ? window.localStorage.getItem("transactions_filter_source") : null) as any) || "all")'
          c = 'searchParams.accountId || localStorage.getItem("transactions_filter_accountId") || null'
          d = 'searchParams.accountId || (typeof window !== "undefined" ? window.localStorage.getItem("transactions_filter_accountId") : null) || null'
          if a not in s or c not in s:
              raise SystemExit('storage expressions not found')
          p.write_text(s.replace(a, b, 1).replace(c, d, 1))
          PY
      - name: Verify
        run: |
          git diff --check
          grep -F 'typeof window !== "undefined" ? window.localStorage.getItem("transactions_filter_source")' src/routes/transactions.tsx
          grep -F 'typeof window !== "undefined" ? window.localStorage.getItem("transactions_filter_accountId")' src/routes/transactions.tsx
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-transactions-storage-init.yml
          git add src/routes/transactions.tsx
          git commit -m "fix: guard transaction storage initialization"
          git push