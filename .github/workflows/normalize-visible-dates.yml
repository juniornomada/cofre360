name: Normalize visible dates
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[visible-date-format-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize user-visible dates and invoice label
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Quick add: preserve stored value, only render dd/MM/yyyy.
          p = Path('src/components/QuickAddTransactionDialog.tsx')
          s = p.read_text()
          anchor = 'const formatQuickAddDate = (date: Date) => format(date, "dd-MM-yyyy");\n'
          helper = anchor + '''const formatQuickAddDisplayDate = (value: string) =>\n  value.replace(/^(\\d{2})-(\\d{2})-(\\d{4})$/, "$1/$2/$3");\n'''
          if anchor not in s:
              raise SystemExit('QuickAdd date helper anchor not found')
          s = s.replace(anchor, helper, 1)
          old = '{newTx.date || "Data"}'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 QuickAdd visible date renders, found {count}')
          s = s.replace(old, '{newTx.date ? formatQuickAddDisplayDate(newTx.date) : "Data"}')
          p.write_text(s)

          # Transactions editor: display dd/MM/yyyy, keep the persisted/editor value format unchanged.
          p = Path('src/routes/transactions.tsx')
          s = p.read_text()
          old = 'return parsed ? format(parsed, "dd-MM-yyyy") : s;'
          new = 'return parsed ? format(parsed, "dd/MM/yyyy") : s;'
          if old not in s:
              raise SystemExit('Transactions visible date formatter anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Card invoices: remove the word Compra and keep only the original date.
          # Also normalize the raw date shown in the installment dialog.
          p = Path('src/routes/cards.tsx')
          s = p.read_text()
          replacements = {
            '<span className="shrink-0 whitespace-nowrap">· Compra: {getInvoicePurchaseDate(tx, cardTransactions) || "definir"}</span>':
              '<span className="shrink-0 whitespace-nowrap">· {getInvoicePurchaseDate(tx, cardTransactions) || "definir"}</span>',
            '<span className="text-[8px] text-muted-foreground">Compra: {getInvoicePurchaseDate(tx, cardTransactions) || "definir"}</span>':
              '<span className="text-[8px] text-muted-foreground">{getInvoicePurchaseDate(tx, cardTransactions) || "definir"}</span>',
            'R$ {Number(installmentTx.amount).toLocaleString("pt-BR", { minimumFractionDigits: 2 })} · {installmentTx.date}':
              'R$ {Number(installmentTx.amount).toLocaleString("pt-BR", { minimumFractionDigits: 2 })} · {formatPurchaseDateBr(installmentTx.date) || installmentTx.date}',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Cards anchor not found: {old[:70]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          git diff --check
          grep -F 'format(parsed, "dd/MM/yyyy")' src/routes/transactions.tsx
          grep -F 'formatQuickAddDisplayDate' src/components/QuickAddTransactionDialog.tsx
          if grep -F 'Compra: {getInvoicePurchaseDate' src/routes/cards.tsx; then exit 1; fi
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/normalize-visible-dates.yml .github/workflows/date-display-audit.yml
          git add src/components/QuickAddTransactionDialog.tsx src/routes/transactions.tsx src/routes/cards.tsx
          git commit -m "fix: normalize visible dates and invoice date label [visible-date-format-applied]"
          git push
