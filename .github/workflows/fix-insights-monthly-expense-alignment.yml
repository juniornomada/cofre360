name: Align Insights monthly expenses

on:
  push:
    paths:
      - .github/workflows/fix-insights-monthly-expense-alignment.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch financial chat monthly totals
        run: python3 .github/scripts/fix_insights_monthly.py

      - name: Validate patch
        run: |
          git diff --check
          grep -F 'MESMA REGRA DA HOME/TRANSAÇÕES' supabase/functions/financial-chat/index.ts
          grep -F 'Reembolsos (abatimento)' supabase/functions/financial-chat/index.ts
          grep -F 'monthlyEconomicSummary' supabase/functions/financial-chat/index.ts

      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-insights-monthly-expense-alignment.yml .github/scripts/fix_insights_monthly.py
          git add supabase/functions/financial-chat/index.ts
          git commit -m "fix: align Insights monthly expenses with app summary"
          git push
