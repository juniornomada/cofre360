name: Apply tested edit feedback helper
on:
  push:
    branches: [feat/debit-credit-installment-date-sync]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[feedback-helper-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch transaction edit feedback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/transactions.tsx')
          s = p.read_text()
          anchor = 'import { inferDebitInstallmentContext } from "@/lib/debit-installment-history-sync";\n'
          imp = 'import { getTransactionEditSuccessMessage, hasInstallmentPlanForEdit } from "@/lib/transaction-edit-feedback";\n'
          if imp not in s:
              if anchor not in s:
                  raise SystemExit('installment sync import not found')
              s = s.replace(anchor, anchor + imp, 1)
          s = s.replace(
              'const hasInstallmentPlan = !!editTx.card || !!editTx.installment_group_id;',
              'const hasInstallmentPlan = hasInstallmentPlanForEdit(editTx);',
              1,
          )
          old = '''      if (result.cleared) {
        toast.success("Parcelamento removido");
      } else if (result.futureRowsAdded > 0) {
        toast.success(
          `Parcelamento salvo (${result.futureRowsAdded} parcela${result.futureRowsAdded > 1 ? "s" : ""} futura${result.futureRowsAdded > 1 ? "s" : ""} criada${result.futureRowsAdded > 1 ? "s" : ""})`
        );
      } else {
        toast.success("Transação atualizada");
      }'''
          new = '''      toast.success(getTransactionEditSuccessMessage(result));'''
          if old not in s:
              raise SystemExit('success feedback block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit feedback helper integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/transactions.tsx
          git commit -m "testability: use tested transaction edit feedback [feedback-helper-applied]"
          git push
