name: Apply economic transaction summary fix

on:
  push:
    paths:
      - .github/workflows/fix-economic-transaction-summary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch transaction summary semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/routes/transactions.tsx")
          text = path.read_text()

          old_filter = '  const filtered = filterType === "all"\n    ? filteredWithoutType\n    : filteredWithoutType.filter((tx) => tx.type === filterType);\n'
          new_filter = '  // Receitas/Despesas representam fluxo econômico real. Transferências entre\n  // contas e pagamentos de cartão continuam visíveis em "Todos", mas não são\n  // classificados como nova receita ou nova despesa.\n  const isEconomicSummaryTransaction = (tx: Transaction) => {\n    const group = parseCategoryValue(tx.category || "").group;\n    return group !== "Transferências" && group !== "Pagamento de Cartão";\n  };\n\n  const filtered = filterType === "all"\n    ? filteredWithoutType\n    : filteredWithoutType.filter((tx) => tx.type === filterType && isEconomicSummaryTransaction(tx));\n'
          old_totals = '  const totalIncome = filteredWithoutType.filter(t => t.type === "income" && t.is_visible !== false).reduce((s, t) => s + t.amount, 0);\n  const totalExpense = filteredWithoutType.filter(t => t.type === "expense" && t.is_visible !== false).reduce((s, t) => s + t.amount, 0);\n'
          new_totals = '  const economicSummaryTransactions = filteredWithoutType.filter(\n    (tx) => tx.is_visible !== false && isEconomicSummaryTransaction(tx),\n  );\n  const totalIncome = economicSummaryTransactions\n    .filter((tx) => tx.type === "income")\n    .reduce((sum, tx) => sum + Number(tx.amount), 0);\n  const totalExpense = economicSummaryTransactions\n    .filter((tx) => tx.type === "expense")\n    .reduce((sum, tx) => sum + Number(tx.amount), 0);\n'

          if old_filter not in text:
              raise SystemExit("filter block not found")
          if old_totals not in text:
              raise SystemExit("totals block not found")

          text = text.replace(old_filter, new_filter, 1)
          text = text.replace(old_totals, new_totals, 1)
          path.write_text(text)
          PY

      - name: Validate patch
        run: |
          git diff --check
          grep -F 'group !== "Transferências" && group !== "Pagamento de Cartão"' src/routes/transactions.tsx
          grep -F 'isEconomicSummaryTransaction(tx)' src/routes/transactions.tsx

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-economic-transaction-summary.yml
          git add src/routes/transactions.tsx
          git commit -m "fix: exclude internal movements from income expense summary"
          git push
