name: Apply visual card picker
on:
  push:
    branches: [main]
    paths: [.github/workflows/hotfix-home-safe-fallback.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch_visual_card_picker.py
      - name: Commit patch and cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/transactions.tsx
          git rm scripts/patch_visual_card_picker.py
          git rm visual-card-picker.trigger
          git rm .github/workflows/apply-visual-card-picker.yml
          git rm .github/workflows/hotfix-subaccount-eye-event-v2.yml
          git rm .github/workflows/hotfix-home-safe-fallback.yml
          git commit -m "feat: use visual card picker in transaction editor"
          git push origin main
