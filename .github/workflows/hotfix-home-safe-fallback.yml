name: Apply installment stepper
on:
  push:
    branches: [main]
    paths: [.github/workflows/hotfix-home-safe-fallback.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply installment stepper
        run: python3 scripts/patch_installment_stepper.py
      - name: Verify
        run: |
          grep -q 'aria-label="Diminuir quantidade de parcelas"' src/routes/transactions.tsx
          grep -q 'aria-label="Aumentar quantidade de parcelas"' src/routes/transactions.tsx
          ! grep -q 'Ou digite outro valor' src/routes/transactions.tsx
      - name: Commit patch and cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/transactions.tsx
          git rm scripts/patch_installment_stepper.py
          git rm .github/workflows/hotfix-home-safe-fallback.yml
          git commit -m "feat: simplify installment quantity control"
          git push origin main
