name: Apply Home monthly navigation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-home-account-hierarchy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply Home monthly navigation patch
        run: |
          python3 scripts/patch_home_monthly_navigation.py
          grep -q 'Visão mensal' src/routes/home.tsx
          grep -q 'selectedMonthTransactions' src/routes/home.tsx
          grep -q 'month: selectedMonthKey' src/routes/home.tsx
      - name: Commit feature and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/home.tsx
          git commit -m 'feat: add monthly navigation to home dashboard'
          git rm scripts/patch_home_monthly_navigation.py
          git rm .github/workflows/hotfix-home-account-hierarchy.yml
          git commit -m 'chore: remove home monthly navigation patch files'
          git push origin main
