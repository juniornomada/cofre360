name: Add transfer description

on:
  push:
    paths:
      - '.github/scripts/add-transfer-description.py'
      - '.github/workflows/add-transfer-description.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python .github/scripts/add-transfer-description.py
      - name: Verify source
        run: |
          grep -q 'Descrição.*opcional' src/components/QuickAddTransactionDialog.tsx
          grep -q 'buildTransferTransactionNames' src/routes/transactions.tsx
          grep -q 'extractTransferDescription' src/lib/transfer-label.ts
          git diff --check
      - name: Build
        run: bun install --frozen-lockfile && bun run build
      - name: Cleanup and commit
        run: |
          rm -f .github/scripts/add-transfer-description.py .github/workflows/add-transfer-description.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add descriptions to transfers'
          git push
