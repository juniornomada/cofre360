name: Apply Insights IA category palette

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-insights-category-palette.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply palette patch
        run: python .github/scripts/apply_insights_palette.py
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/FinancialChat.tsx
          git commit -m "feat: differentiate Insights IA category colors"
          git push
