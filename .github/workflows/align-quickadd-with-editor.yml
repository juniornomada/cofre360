name: Align quick add with editor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/align-quickadd-with-editor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Use the same responsive shell as Edit Transaction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/QuickAddTransactionDialog.tsx')
          text = path.read_text()

          replacements = [
            (
              '<DialogContent className="w-[calc(100dvw-24px)] max-w-[calc(100dvw-24px)] h-[calc(100dvh-24px)] max-h-[calc(100dvh-24px)] min-h-0 rounded-2xl bg-background overflow-hidden p-0 gap-0 flex flex-col sm:h-auto sm:max-h-[88dvh] sm:min-h-[640px] sm:w-[28rem] sm:max-w-[28rem]">',
              '''<DialogContent
        style={{
          width: "calc(100dvw - 24px)",
          maxWidth: "calc(100dvw - 24px)",
          left: "50%",
          right: "auto",
          transform: "translate(-50%, -50%)",
          boxSizing: "border-box",
        }}
        className="fixed top-1/2 rounded-2xl bg-background h-[min(88dvh,calc(100dvh-24px))] max-h-[calc(100dvh-24px)] overflow-hidden p-0 flex min-w-0 flex-col gap-0 sm:h-auto sm:max-h-[88dvh] sm:!w-[28rem] sm:!max-w-[28rem]"
      >'''
            ),
            (
              '<DialogHeader className="shrink-0 space-y-0 border-b border-border/50 p-4 pb-3 pr-10">',
              '<DialogHeader className="shrink-0 space-y-0 p-4 pb-2 pr-10 border-b">'
            ),
            (
              '<div className="flex-1 min-h-0 overflow-y-auto overscroll-contain p-4 flex flex-col gap-2.5">',
              '<div className="flex-1 min-h-0 min-w-0 overscroll-contain overflow-x-hidden overflow-y-auto p-4 flex flex-col gap-2.5">'
            ),
            (
              '<DialogFooter className="shrink-0 border-t border-border/50 bg-background p-4 pt-3 flex-row gap-2 sm:gap-2">',
              '<DialogFooter className="shrink-0 p-4 pt-2 border-t mt-0 flex-row gap-2 sm:gap-2">'
            ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:120]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/QuickAddTransactionDialog.tsx
          git diff --cached --check
          git commit -m "fix: match quick-add dialog to edit transaction layout"
          git push origin main
