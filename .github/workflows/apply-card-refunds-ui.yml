name: Apply card refund tracking UI

on:
  push:
    branches: ["main"]

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python3 .github/scripts/apply_card_refunds_ui.py
      - name: Verify patch
        run: |
          git diff --check
          grep -F 'type CardRefund = {' src/routes/cards.tsx
          grep -F 'Reembolso pendente' src/routes/cards.tsx
          grep -F 'confirmCardRefund' src/routes/cards.tsx
          grep -F 'tx.type === "income" ? "+" : "-"' src/routes/cards.tsx
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-card-refunds-ui.yml .github/scripts/apply_card_refunds_ui.py
          git add src/routes/cards.tsx
          git commit -m 'feat: track pending card refunds until confirmed'
          git push
