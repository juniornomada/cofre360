name: Mobile invoice transaction edit

on:
  push:
    paths:
      - "scripts/mobile_invoice_transaction_edit.py"
      - ".github/workflows/mobile-invoice-transaction-edit.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python scripts/mobile_invoice_transaction_edit.py
      - name: Verify invoice actions
        run: |
          grep -n 'Mobile/touch: edição direta sempre visível' src/routes/cards.tsx
          grep -n 'aria-label={`Editar ${normalizePaymentDescription' src/routes/cards.tsx
          grep -n 'Editar parcelamento' src/routes/cards.tsx
          grep -n 'Excluir transação' src/routes/cards.tsx
          git diff --check
      - name: Relevant tests
        run: bunx vitest run src/tests/card-payment-display.test.ts src/tests/card-realtime-integration.test.ts src/tests/cards-invoice-sort-guard.test.ts
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/mobile_invoice_transaction_edit.py
          rm .github/workflows/mobile-invoice-transaction-edit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: edit invoice transactions directly on mobile"
          git push
