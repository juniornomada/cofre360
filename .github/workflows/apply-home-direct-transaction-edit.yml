name: Apply direct transaction edit from Home
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-home-direct-transaction-edit.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Home recent transactions to editor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path('src/routes/home.tsx')
          s = home.read_text()
          old = '''            <Link key={tx.id} to="/transactions" search={{ month: selectedMonthKey } as any} className="flex items-center gap-3 rounded-xl border border-border/20 bg-card px-3 py-2.5">'''
          new = '''            <Link key={tx.id} to="/transactions" search={{ month: selectedMonthKey, editId: tx.id } as any} className="flex items-center gap-3 rounded-xl border border-border/20 bg-card px-3 py-2.5">'''
          if old not in s:
              raise SystemExit('home recent transaction link anchor not found')
          s = s.replace(old, new, 1)
          home.write_text(s)

          tx = Path('src/routes/transactions.tsx')
          t = tx.read_text()

          ref_anchor = '''   const emptyStateRef = useRef<HTMLDivElement>(null); const listRef = useRef<HTMLDivElement>(null);\n'''
          ref_new = '''   const emptyStateRef = useRef<HTMLDivElement>(null); const listRef = useRef<HTMLDivElement>(null);\n   const directEditHandledRef = useRef<string | null>(null);\n'''
          if 'directEditHandledRef' not in t:
              if ref_anchor not in t:
                  raise SystemExit('transactions ref anchor not found')
              t = t.replace(ref_anchor, ref_new, 1)

          handle_copy_anchor = '''  const handleCopy = (tx: Transaction) => {\n'''
          effect = '''  useEffect(() => {\n    const editId = searchParams.editId;\n    if (!editId || loading || directEditHandledRef.current === editId) return;\n\n    const target = transactions.find((tx) => tx.id === editId);\n    if (!target) return;\n\n    directEditHandledRef.current = editId;\n    handleEdit(target);\n  }, [searchParams.editId, loading, transactions]);\n\n'''
          if 'const editId = searchParams.editId;' not in t:
              if handle_copy_anchor not in t:
                  raise SystemExit('handleCopy anchor not found')
              t = t.replace(handle_copy_anchor, effect + handle_copy_anchor, 1)

          validate_anchor = '''     month: (search.month as string) || undefined,\n'''
          validate_new = '''     month: (search.month as string) || undefined,\n     editId: (search.editId as string) || undefined,\n'''
          if 'editId: (search.editId as string)' not in t:
              if validate_anchor not in t:
                  raise SystemExit('validateSearch month anchor not found')
              t = t.replace(validate_anchor, validate_new, 1)

          tx.write_text(t)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-home-direct-transaction-edit.yml
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/home.tsx src/routes/transactions.tsx .github/workflows/apply-home-direct-transaction-edit.yml
          git commit -m "feat: open Home transactions directly in editor"
          git push
