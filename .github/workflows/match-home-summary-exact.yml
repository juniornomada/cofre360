name: Match Home transaction totals

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/match-home-summary-exact.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align card container
        shell: bash
        run: |
          sed -i '/Receitas \/ Despesas: resumo original + filtro ao tocar/{n;s/className="grid grid-cols-2 gap-2"/className="-mx-1 grid grid-cols-2 gap-2"/;}' src/routes/transactions.tsx
          grep -A1 'Receitas / Despesas: resumo original + filtro ao tocar' src/routes/transactions.tsx | grep -q 'className="-mx-1 grid grid-cols-2 gap-2"'
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/match-home-summary-exact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/transactions.tsx .github/workflows/match-home-summary-exact.yml
          git commit -m 'style: center transaction totals like Home'
          git push
