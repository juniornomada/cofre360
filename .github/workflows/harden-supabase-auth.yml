name: Harden Supabase Auth

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/harden-supabase-auth.mjs"
      - ".github/workflows/harden-supabase-auth.yml"

permissions:
  contents: read

jobs:
  harden-auth:
    name: Apply production Auth hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Apply and verify targeted Supabase Auth settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/harden-supabase-auth.mjs
