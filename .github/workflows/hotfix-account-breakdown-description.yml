name: Hotfix account breakdown description
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-account-breakdown-description.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix invalid transaction column
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/accounts.tsx')
          s = p.read_text()
          old = '.select("id, date, description, amount, type, is_visible, card")'
          new = '.select("id, date, description:name, amount, type, is_visible, card")'
          if old not in s:
              raise SystemExit('target select not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/accounts.tsx
          git commit -m "fix: use transaction name in account balance breakdown"
          git push
