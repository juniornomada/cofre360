name: Simplify home month navigator
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-account-breakdown-description.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Simplify month navigator
        run: |
          sed -i '/Visão mensal/d' src/routes/home.tsx
          sed -i '/Previsto até o fim do mês/d' src/routes/home.tsx
          sed -i 's/truncate text-sm font-bold text-foreground/truncate text-base font-bold text-foreground/' src/routes/home.tsx
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/home.tsx
          git commit -m "style: simplify home month navigation"
          git push
