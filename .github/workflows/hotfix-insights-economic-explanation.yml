name: Fix refund expense visuals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-insights-economic-explanation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply refund visual patch
        run: python .github/scripts/fix_refund_visuals.py
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/CategoryPieCharts.tsx src/routes/transactions.tsx src/routes/home.tsx
          git commit -m "fix: classify refunds as expense abatements"
          git push
