name: Fix Insights IA old installment categories
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-insights-economic-explanation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix old installment category intent
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/financial-chat/index.ts')
          text = path.read_text()

          if 'function oldInstallmentCategoryTotals(' not in text:
              anchor = 'function categoryTotals(rows: EconomicExpense[], key: string) {'
              start = text.index(anchor)
              end = text.index('\n}\n', start) + 3
              helper = "\n".join([
                  '',
                  'function oldInstallmentCategoryTotals(rows: Transaction[], key: string) {',
                  '  const totals = new Map<string, number>();',
                  '',
                  '  for (const tx of rows) {',
                  '    if (tx.is_visible === false || tx.type !== "expense" || !tx.card) continue;',
                  '    if (isTransferOrCardPayment(tx.category) || isAdjustmentCategory(tx.category)) continue;',
                  '',
                  '    const totalInstallments = Number(tx.total_installments || 1);',
                  '    const installmentNumber = Math.max(1, Number(tx.installment_number || 1));',
                  '    if (totalInstallments <= 1) continue;',
                  '',
                  '    const chargeDate = parseTxDate(tx.date, tx.created_at);',
                  '    if (!chargeDate || monthKey(chargeDate) !== key) continue;',
                  '',
                  '    let purchaseDate = parseTxDate(tx.purchase_date, tx.created_at);',
                  '    if (!purchaseDate && installmentNumber > 1) {',
                  '      purchaseDate = shiftMonths(chargeDate, -(installmentNumber - 1));',
                  '    }',
                  '    if (!purchaseDate || monthKey(purchaseDate) === key) continue;',
                  '',
                  '    const category = rootCategory(tx.category);',
                  '    totals.set(category, (totals.get(category) || 0) + Number(tx.amount || 0));',
                  '  }',
                  '',
                  '  return [...totals.entries()]',
                  '    .map(([category, amount]) => [category, roundMoney(amount)] as [string, number])',
                  '    .filter(([, amount]) => amount !== 0)',
                  '    .sort((a, b) => b[1] - a[1]);',
                  '}',
                  '',
              ])
              text = text[:end] + helper + text[end:]

          intent_anchor = '  const asksCategoryBreakdown = /(gastos? por categoria|em quais categorias|quais categorias|categorias? .*gastei|gastei .*categorias?)/.test(q);'
          if 'const asksOldInstallmentCategories' not in text:
              intent_lines = [
                  '  const asksOldInstallmentCategories =',
                  '    /(parcelas?.*(compras?|gastos?).*(antig|anterior)|compras? .*antig.*parcelas?|parcelas? .*mes(es)? anterior)/.test(q) &&',
                  '    /(categor|respons|quais|origem|vieram|onde)/.test(q);',
                  intent_anchor,
              ]
              if intent_anchor not in text:
                  raise SystemExit('Could not find category intent')
              text = text.replace(intent_anchor, "\n".join(intent_lines), 1)

          gate_old = '  if (!detailOnly && !asksCategoryBreakdown && !asksObjectiveAmount && !asksEconomicVsExpenseConcept) return null;'
          gate_new = '  if (!detailOnly && !asksOldInstallmentCategories && !asksCategoryBreakdown && !asksObjectiveAmount && !asksEconomicVsExpenseConcept) return null;'
          if gate_new not in text:
              if gate_old not in text:
                  raise SystemExit('Could not find deterministic gate')
              text = text.replace(gate_old, gate_new, 1)

          calculation_anchor = '  const categoryTotal = roundMoney(categories.reduce((sum, [, value]) => sum + value, 0));'
          if 'const oldInstallmentCategories = oldInstallmentCategoryTotals' not in text:
              calculation_lines = [
                  calculation_anchor,
                  '  const oldInstallmentCategories = oldInstallmentCategoryTotals(transactions, key);',
                  '  const oldInstallmentTotal = roundMoney(oldInstallmentCategories.reduce((sum, [, value]) => sum + value, 0));',
              ]
              if calculation_anchor not in text:
                  raise SystemExit('Could not find category total anchor')
              text = text.replace(calculation_anchor, "\n".join(calculation_lines), 1)

          answer_anchor = '  if (asksEconomicVsExpenseConcept && !detailOnly) {'
          if 'Parcelas de compras antigas por categoria' not in text:
              answer_lines = [
                  '  if (asksOldInstallmentCategories && !detailOnly) {',
                  '    const oldInstallmentLines = oldInstallmentCategories.length',
                  '      ? oldInstallmentCategories.slice(0, 12).map(([category, amount]) => `- ${categoryEmoji(category)} **${category} — R$ ${formatBRL(amount)}**`).join("\\n")',
                  '      : "(nenhuma parcela de compra antiga cobrada no período)";',
                  '',
                  '    return `### 💳 Parcelas de compras antigas por categoria — ${label}\\n\\n**Total cobrado no mês vindo de compras anteriores: R$ ${formatBRL(oldInstallmentTotal)}**\\n\\n${oldInstallmentLines}\\n\\n> 💡 Aqui entram somente **parcelas cobradas em ${label} cuja compra original ocorreu em mês anterior**. Isso é diferente de “Gastos por categoria”, que mostra as compras realizadas no próprio período pelo valor econômico total.`;',
                  '  }',
                  '',
                  answer_anchor,
              ]
              if answer_anchor not in text:
                  raise SystemExit('Could not find deterministic answer anchor')
              text = text.replace(answer_anchor, "\n".join(answer_lines), 1)

          prompt_anchor = '- NUNCA use a "Composição das DESPESAS pelo mês de cobrança/lançamento" como se fosse gasto novo por categoria. Ela serve apenas para explicar quais parcelas/lançamentos compõem o card mensal de DESPESAS e pode incluir compras de meses anteriores.'
          prompt_line = '- Se o usuário perguntar especificamente quais categorias originaram parcelas de compras antigas cobradas no mês, responda SOMENTE com as parcelas do mês cuja compra original ocorreu em mês anterior, agrupadas pela categoria da compra. Não use a visão geral de "Gastos por categoria" para essa pergunta.'
          if prompt_line not in text:
              if prompt_anchor not in text:
                  raise SystemExit('Could not find system prompt installment anchor')
              text = text.replace(prompt_anchor, prompt_anchor + "\n" + prompt_line, 1)

          path.write_text(text)
          PY
          grep -q 'oldInstallmentCategoryTotals' supabase/functions/financial-chat/index.ts
          grep -q 'asksOldInstallmentCategories' supabase/functions/financial-chat/index.ts
          grep -q 'Parcelas de compras antigas por categoria' supabase/functions/financial-chat/index.ts
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/financial-chat/index.ts
          git commit -m "fix: answer old installment categories correctly"
          git push
