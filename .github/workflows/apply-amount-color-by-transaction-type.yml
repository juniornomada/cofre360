name: Apply amount color by transaction type
on:
  push:
    branches: [feat/debit-credit-installment-date-sync]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply amount input colors
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path('src/components/QuickAddTransactionDialog.tsx')
          s = p.read_text()
          matches = list(re.finditer(r'<CalculatorAmountInput\b[\s\S]*?/>', s))
          if not matches:
              raise SystemExit('no CalculatorAmountInput blocks found')

          changed_transfer = 0
          changed_regular = 0
          out = []
          cursor = 0

          for m in matches:
              block = m.group(0)
              new_block = block

              if 'autoFocus={false}' in block and 'setNewTx({ ...newTx, amount: v })' in block:
                  if '!text-black dark:!text-white' not in block:
                      new_block, n = re.subn(
                          r'(?m)^(\s*)autoFocus=\{false\}\s*$',
                          r'\1autoFocus={false}\n\1className="!text-black dark:!text-white"',
                          block,
                          count=1,
                      )
                      changed_transfer += n
              elif 'onEnter={handleAdd}' in block and 'setNewTx({ ...newTx, amount: v });' in block:
                  if '!text-red-500' not in block:
                      new_block, n = re.subn(
                          r'(?m)^(\s*)onEnter=\{handleAdd\}\s*$',
                          r'\1onEnter={handleAdd}\n\1className={newTx.type === "expense" ? "!text-red-500" : "!text-green-600 dark:!text-green-500"}',
                          block,
                          count=1,
                      )
                      changed_regular += n

              out.append(s[cursor:m.start()])
              out.append(new_block)
              cursor = m.end()

          out.append(s[cursor:])
          s = ''.join(out)

          if changed_transfer != 1:
              raise SystemExit(f'expected one transfer block, changed {changed_transfer}')
          if changed_regular != 1:
              raise SystemExit(f'expected one regular block, changed {changed_regular}')

          p.write_text(s)
          PY

      - name: Add regression test
        run: |
          cat > src/tests/quick-add-amount-color.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import fs from "node:fs";
          import path from "node:path";

          describe("QuickAdd amount color by transaction type", () => {
            const source = fs.readFileSync(
              path.resolve(process.cwd(), "src/components/QuickAddTransactionDialog.tsx"),
              "utf8",
            );

            it("uses red for expenses and green for income", () => {
              expect(source).toContain('newTx.type === "expense" ? "!text-red-500" : "!text-green-600 dark:!text-green-500"');
            });

            it("uses neutral black/light and white/dark for transfers", () => {
              expect(source).toContain('className="!text-black dark:!text-white"');
            });
          });
          EOF

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-amount-color-by-transaction-type.yml
          git add src/components/QuickAddTransactionDialog.tsx src/tests/quick-add-amount-color.test.ts
          git commit -m "feat: color amount by transaction type"
          git push
