name: Run purchase date editor fix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/fix_purchase_date_editor.py
      - name: Verify patch
        run: |
          git diff --check
          grep -F "Data da compra" src/routes/cards.tsx
          grep -F "A parcela permanece na fatura original." src/routes/cards.tsx
          grep -F "purchase_date: editTx.purchase_date || null" src/routes/cards.tsx
          grep -F "Data da compra" src/routes/transactions.tsx
          grep -F "purchase_date: editTx.purchase_date ?? null" src/routes/transactions.tsx
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-purchase-date-editor.yml
          git rm .github/workflows/run-purchase-date-editor-fix.yml
          git rm scripts/fix_purchase_date_editor.py
          git add src/routes/cards.tsx src/routes/transactions.tsx src/lib/edit-transaction-draft.ts
          git commit -m "fix: edit purchase date without moving card installment"
          git push