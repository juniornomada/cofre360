name: Fix transaction mobile header actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-transaction-editor-mobile-definitive.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove unused report menu and fix mobile header
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/routes/transactions.tsx')
          s = p.read_text()

          replacements = [
            (
              '''  return (\n    <div className="animate-page-enter flex flex-col gap-4 px-4 pt-6 pb-24">\n      <div className="flex items-center justify-between">''',
              '''  return (\n    <div className="animate-page-enter flex flex-col gap-4 px-4 pt-6 pb-24">\n      <div className="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">'''
            ),
            (
              '''        <div className="flex items-center gap-2">\n          <div className="flex gap-2">''',
              '''        <div className="flex items-center justify-end gap-1 sm:gap-2">\n          <div className="flex gap-1 sm:gap-2">'''
            ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one header match, found {count}: {old[:100]}')
              s = s.replace(old, new, 1)

          menu = '''              <DropdownMenu>\n                <DropdownMenuTrigger asChild>\n                  <button className="flex h-10 w-10 items-center justify-center rounded-full bg-card text-muted-foreground border border-border shadow-sm hover:bg-accent transition-all" aria-label="Mais ações" title="Mais ações">\n                    <MoreVertical className="h-5 w-5" />\n                  </button>\n                </DropdownMenuTrigger>\n                <DropdownMenuContent align="end" className="rounded-xl">\n                  <DropdownMenuItem onClick={generatePDF} className="cursor-pointer">\n                    <FileText className="h-4 w-4 mr-2" />\n                    Gerar relatório PDF\n                  </DropdownMenuItem>\n                  <DropdownMenuItem onClick={() => setShowCsvImport(true)} className="cursor-pointer">\n                    <Upload className="h-4 w-4 mr-2" />\n                    Importar CSV\n                  </DropdownMenuItem>\n                </DropdownMenuContent>\n              </DropdownMenu>\n              \n'''
          count = s.count(menu)
          if count != 1:
              raise SystemExit(f'Expected exactly one report/import menu, found {count}')
          s = s.replace(menu, '', 1)

          p.write_text(s)
          PY

      - name: Verify patch
        run: |
          if grep -q 'Gerar relatório PDF' src/routes/transactions.tsx; then
            echo 'Report menu still present' >&2
            exit 1
          fi
          if grep -q 'aria-label="Mais ações"' src/routes/transactions.tsx; then
            echo 'More-actions trigger still present' >&2
            exit 1
          fi
          grep -F 'flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between' src/routes/transactions.tsx
          grep -F 'flex items-center justify-end gap-1 sm:gap-2' src/routes/transactions.tsx

      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/transactions.tsx
          git diff --cached --check
          git commit -m "fix: keep add transaction action visible on mobile"
          git rm .github/workflows/fix-transaction-editor-mobile-definitive.yml
          git commit -m "chore: remove transaction header patch workflow"
          git push origin main
