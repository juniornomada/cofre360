name: Invoice edit future scope

on:
  push:
    paths:
      - "scripts/patch_invoice_edit_scope.py"
      - ".github/workflows/invoice-edit-future-scope.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python scripts/patch_invoice_edit_scope.py
      - name: Verify source
        run: |
          grep -n 'Aplicar alteração no parcelamento' src/routes/cards.tsx
          grep -n 'Esta e as futuras' src/routes/cards.tsx
          grep -n 'gte("installment_number", current)' src/routes/cards.tsx
          git diff --check
      - name: Relevant tests
        run: bunx vitest run src/tests/cards-invoice-edit-future-scope.test.ts src/tests/cards-invoice-sort-guard.test.ts
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/patch_invoice_edit_scope.py
          rm .github/workflows/invoice-edit-future-scope.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply invoice edits to future installments"
          git push
