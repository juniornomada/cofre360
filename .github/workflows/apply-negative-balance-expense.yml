name: Allow expense beyond account balance
on:
  push:
    branches:
      - feat/debit-credit-installment-date-sync
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove expense balance blocker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/QuickAddTransactionDialog.tsx')
          s = p.read_text()
          start = s.index('      // Balance check for expenses from bank accounts\n')
          end = s.index('      const cardValue =', start)
          s = s[:start] + '      // Expenses may intentionally leave the selected account with a negative balance.\n\n' + s[end:]
          p.write_text(s)
          PY
      - name: Commit change and remove workflow
        run: |
          git rm .github/workflows/apply-negative-balance-expense.yml
          git rm -f scripts/trigger-negative-balance-expense.txt || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/QuickAddTransactionDialog.tsx
          git commit -m "feat: allow expenses beyond account balance"
          git push
