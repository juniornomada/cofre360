name: Apply natural voice sentence parsing

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch parser and tests
        run: |
          python3 <<'PY'
          from pathlib import Path

          voice_path = Path("src/lib/voice-transaction.ts")
          s = voice_path.read_text(encoding="utf-8")

          amount_anchor = '  const numeric = text.match(/(?:r\\$\\s*)'
          amount_insert = '''  const conversationalNumeric = text.match(
            /\\b(?:gastei|paguei|comprei|adquiri|recebi|ganhei|lancei|registrei|adicionei)\\s+(?:r\\$\\s*)?(\\d{1,3}(?:\\.\\d{3})+(?:,\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)\\b/i,
          );
          if (conversationalNumeric) return moneyToNumber(conversationalNumeric[1]);

          '''
          if 'const conversationalNumeric = text.match' not in s:
              if amount_anchor not in s:
                  raise SystemExit("parseAmount insertion anchor not found")
              s = s.replace(amount_anchor, amount_insert + amount_anchor, 1)

          ref_anchor = 'function parseReference(text: string): string | null {'
          ref_helper = '''function canonicalizeKnownReference(value: string): string {
            const normalized = normalize(value);
            if (normalized === "mae") return "mãe";
            if (normalized === "pai") return "pai";
            if (normalized === "creta") return "Creta";
            if (normalized === "spacefox" || normalized === "space fox") return "Spacefox";
            return value;
          }

          '''
          if 'function canonicalizeKnownReference' not in s:
              if ref_anchor not in s:
                  raise SystemExit("parseReference anchor not found")
              s = s.replace(ref_anchor, ref_helper + ref_anchor, 1)

          ref_start = s.index(ref_anchor)
          ref_end = s.index('function parseInstallments', ref_start)
          ref_block = s[ref_start:ref_end]
          old_lookahead = '(?=\\\\s+(?:${METADATA_BOUNDARY})|[,.]|$)'
          new_lookahead = '(?=\\\\s+(?:(?:na|no|em)\\\\s+)?(?:${METADATA_BOUNDARY})|[,.]|$)'
          if old_lookahead in ref_block:
              ref_block = ref_block.replace(old_lookahead, new_lookahead, 1)
          elif new_lookahead not in ref_block:
              raise SystemExit("parseReference lookahead anchor not found")
          ref_block = ref_block.replace('  return reference;\n', '  return canonicalizeKnownReference(reference);\n', 1)
          s = s[:ref_start] + ref_block + s[ref_end:]

          money_start = s.index('function findMoneyPosition')
          money_end = s.index('function extractName', money_start)
          money_block = s[money_start:money_end]
          conversational_pattern = '    /\\b(?:gastei|paguei|comprei|adquiri|recebi|ganhei|lancei|registrei|adicionei)\\s+(?:r\\$\\s*)?(\\d{1,3}(?:\\.\\d{3})+(?:,\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)\\b/i,\n'
          if conversational_pattern not in money_block:
              patterns_anchor = '  const patterns = [\n'
              if patterns_anchor not in money_block:
                  raise SystemExit("findMoneyPosition patterns anchor not found")
              money_block = money_block.replace(patterns_anchor, patterns_anchor + conversational_pattern, 1)
          s = s[:money_start] + money_block + s[money_end:]

          parse_anchor = 'export function parseVoiceTransaction(transcript: string, now = new Date()): VoiceTransactionDraft {'
          name_helper = '''function canonicalizeKnownTransactionName(value: string): string {
            return value.replace(/^Posto de gasolina\\b/i, "Posto de Gasolina");
          }

          '''
          if 'function canonicalizeKnownTransactionName' not in s:
              if parse_anchor not in s:
                  raise SystemExit("parseVoiceTransaction anchor not found")
              s = s.replace(parse_anchor, name_helper + parse_anchor, 1)

          old_compose = '''  const name = reference && !baseName.endsWith(`(${reference})`)
            ? `${baseName} (${reference})`
            : baseName;'''
          new_compose = '''  const composedName = reference && !baseName.endsWith(`(${reference})`)
            ? `${baseName} (${reference})`
            : baseName;
          const name = canonicalizeKnownTransactionName(composedName);'''
          if old_compose in s:
              s = s.replace(old_compose, new_compose, 1)
          elif 'const name = canonicalizeKnownTransactionName(composedName);' not in s:
              raise SystemExit("name compose anchor not found")

          voice_path.write_text(s, encoding="utf-8")

          test_path = Path("src/lib/__tests__/voice-transaction.test.ts")
          t = test_path.read_text(encoding="utf-8")
          insert = '''

            it("entende frase informal completa com valor, referência e conta", () => {
              const draft = parseVoiceTransaction(
                "Gastei 150.99 em posto de gasolina referência Space Fox na conta Banco do Brasil.",
                now,
              );

              expect(draft.type).toBe("expense");
              expect(draft.amount).toBe(150.99);
              expect(draft.name).toBe("Posto de Gasolina (Spacefox)");
              expect(draft.category).toBe("Transporte > Combustível");
              expect(draft.bankAccount).toBe("Banco do Brasil");
            });

            it("aceita vírgula no valor da frase informal completa", () => {
              const draft = parseVoiceTransaction(
                "Gastei 150,99 em posto de gasolina referência Space Fox na conta Banco do Brasil",
                now,
              );
              expect(draft.amount).toBe(150.99);
              expect(draft.name).toBe("Posto de Gasolina (Spacefox)");
              expect(draft.bankAccount).toBe("Banco do Brasil");
            });'''
          if 'entende frase informal completa com valor, referência e conta' not in t:
              marker = '\n});\n'
              pos = t.rfind(marker)
              if pos < 0:
                  raise SystemExit("test suite closing marker not found")
              t = t[:pos] + insert + t[pos:]
          test_path.write_text(t, encoding="utf-8")
          PY

      - name: Verify and test
        run: |
          git diff --check
          grep -F 'Gastei 150.99 em posto de gasolina referência Space Fox na conta Banco do Brasil.' src/lib/__tests__/voice-transaction.test.ts
          bunx vitest run src/lib/__tests__/voice-transaction.test.ts

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-natural-voice-sentence.yml
          git add src/lib/voice-transaction.ts src/lib/__tests__/voice-transaction.test.ts
          git commit -m "fix: parse natural voice transaction sentences"
          git push
