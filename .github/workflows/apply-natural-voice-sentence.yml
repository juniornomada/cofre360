name: Apply natural voice sentence parsing

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch parser and tests
        run: |
          python3 <<'PY'
          from pathlib import Path

          voice_path = Path("src/lib/voice-transaction.ts")
          s = voice_path.read_text(encoding="utf-8")

          old = '''  const numeric = text.match(/(?:r\\$\\s*)(\\d{1,3}(?:\\.\\d{3})+(?:,\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)/i)
            || text.match(/(\\d{1,3}(?:\\.\\d{3})+(?:,\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)\\s*(?:reais?|real)\\b/i)
            || text.match(/\\b(?:no\\s+valor\\s+de|valor\\s+de|valor)\\s*(?:[,;:=\\-]\\s*)?(\\d{1,3}(?:\\.\\d{3})+(?:,\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)/i);
          if (numeric) return moneyToNumber(numeric[1]);'''
          new = '''  const conversationalNumeric = text.match(
            /\\b(?:gastei|paguei|comprei|adquiri|recebi|ganhei|lancei|registrei|adicionei)\\s+(?:r\\$\\s*)?(\\d{1,3}(?:\\.\\d{3})+(?:,\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)\\b/i,
          );
          if (conversationalNumeric) return moneyToNumber(conversationalNumeric[1]);

          const numeric = text.match(/(?:r\\$\\s*)(\\d{1,3}(?:\\.\\d{3})+(?:,\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)/i)
            || text.match(/(\\d{1,3}(?:\\.\\d{3})+(?:,\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)\\s*(?:reais?|real)\\b/i)
            || text.match(/\\b(?:no\\s+valor\\s+de|valor\\s+de|valor)\\s*(?:[,;:=\\-]\\s*)?(\\d{1,3}(?:\\.\\d{3})+(?:,\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)/i);
          if (numeric) return moneyToNumber(numeric[1]);'''
          if old not in s:
              raise SystemExit("parseAmount anchor not found")
          s = s.replace(old, new, 1)

          anchor = '''function parseReference(text: string): string | null {'''
          helper = '''function canonicalizeKnownReference(value: string): string {
            const normalized = normalize(value);
            if (normalized === "mae") return "mãe";
            if (normalized === "pai") return "pai";
            if (normalized === "creta") return "Creta";
            if (normalized === "spacefox" || normalized === "space fox") return "Spacefox";
            return value;
          }

          function parseReference(text: string): string | null {'''
          if anchor not in s:
              raise SystemExit("parseReference anchor not found")
          s = s.replace(anchor, helper, 1)

          old = '''    `\\\\brefer[eê]ncia\\\\s*(?:[,;:=\\\\-]\\\\s*)?(?:é|e)?\\\\s*(.+?)(?=\\\\s+(?:${METADATA_BOUNDARY})|[,.]|$)`,'''
          new = '''    `\\\\brefer[eê]ncia\\\\s*(?:[,;:=\\\\-]\\\\s*)?(?:é|e)?\\\\s*(.+?)(?=\\\\s+(?:(?:na|no|em)\\\\s+)?(?:${METADATA_BOUNDARY})|[,.]|$)`,'''
          if old not in s:
              raise SystemExit("parseReference regex anchor not found")
          s = s.replace(old, new, 1)

          old = '''  return reference;
          }

          function parseInstallments'''
          new = '''  return canonicalizeKnownReference(reference);
          }

          function parseInstallments'''
          if old not in s:
              raise SystemExit("parseReference return anchor not found")
          s = s.replace(old, new, 1)

          old = '''  const patterns = [
            /(?:r\\$\\s*)(\\d{1,3}(?:\\.\\d{3})+(?:,\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)/i,'''
          new = '''  const patterns = [
            /\\b(?:gastei|paguei|comprei|adquiri|recebi|ganhei|lancei|registrei|adicionei)\\s+(?:r\\$\\s*)?(\\d{1,3}(?:\\.\\d{3})+(?:,\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)\\b/i,
            /(?:r\\$\\s*)(\\d{1,3}(?:\\.\\d{3})+(?:,\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)/i,'''
          if old not in s:
              raise SystemExit("findMoneyPosition anchor not found")
          s = s.replace(old, new, 1)

          anchor = '''export function parseVoiceTransaction(transcript: string, now = new Date()): VoiceTransactionDraft {'''
          helper = '''function canonicalizeKnownTransactionName(value: string): string {
            return value.replace(/^Posto de gasolina\\b/i, "Posto de Gasolina");
          }

          export function parseVoiceTransaction(transcript: string, now = new Date()): VoiceTransactionDraft {'''
          if anchor not in s:
              raise SystemExit("parseVoiceTransaction anchor not found")
          s = s.replace(anchor, helper, 1)

          old = '''  const name = reference && !baseName.endsWith(`(${reference})`)
            ? `${baseName} (${reference})`
            : baseName;
          const inferred = isYield'''
          new = '''  const composedName = reference && !baseName.endsWith(`(${reference})`)
            ? `${baseName} (${reference})`
            : baseName;
          const name = canonicalizeKnownTransactionName(composedName);
          const inferred = isYield'''
          if old not in s:
              raise SystemExit("name compose anchor not found")
          s = s.replace(old, new, 1)

          voice_path.write_text(s, encoding="utf-8")

          test_path = Path("src/lib/__tests__/voice-transaction.test.ts")
          t = test_path.read_text(encoding="utf-8")
          insert = '''

            it("entende frase informal completa com valor, referência e conta", () => {
              const draft = parseVoiceTransaction(
                "Gastei 150.99 em posto de gasolina referência Space Fox na conta Banco do Brasil.",
                now,
              );

              expect(draft.type).toBe("expense");
              expect(draft.amount).toBe(150.99);
              expect(draft.name).toBe("Posto de Gasolina (Spacefox)");
              expect(draft.category).toBe("Transporte > Combustível");
              expect(draft.bankAccount).toBe("Banco do Brasil");
            });

            it("aceita vírgula no valor da frase informal completa", () => {
              const draft = parseVoiceTransaction(
                "Gastei 150,99 em posto de gasolina referência Space Fox na conta Banco do Brasil",
                now,
              );
              expect(draft.amount).toBe(150.99);
              expect(draft.name).toBe("Posto de Gasolina (Spacefox)");
              expect(draft.bankAccount).toBe("Banco do Brasil");
            });'''
          marker = '\n});\n'
          pos = t.rfind(marker)
          if pos < 0:
              raise SystemExit("test suite closing marker not found")
          if 'entende frase informal completa com valor, referência e conta' not in t:
              t = t[:pos] + insert + t[pos:]
          test_path.write_text(t, encoding="utf-8")
          PY

      - name: Verify and test
        run: |
          git diff --check
          grep -F 'Gastei 150.99 em posto de gasolina referência Space Fox na conta Banco do Brasil.' src/lib/__tests__/voice-transaction.test.ts
          bunx vitest run src/lib/__tests__/voice-transaction.test.ts

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-natural-voice-sentence.yml
          git add src/lib/voice-transaction.ts src/lib/__tests__/voice-transaction.test.ts
          git commit -m "fix: parse natural voice transaction sentences"
          git push
