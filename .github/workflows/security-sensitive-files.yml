name: Security - sensitive files

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sensitive-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject tracked secrets and financial exports
        run: node scripts/check-no-sensitive-files.mjs
