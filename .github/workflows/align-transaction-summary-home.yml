name: Align transaction summary cards with Home

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-transaction-summary-home.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align summary cards
        run: |
          echo '' | base64 -d | gzip -d | python3
      - name: Verify
        run: |
          grep -q 'mesmo visual da Home + filtro ao tocar' src/routes/transactions.tsx
          grep -q '<section className="grid grid-cols-2 gap-2">' src/routes/transactions.tsx
          grep -q 'rounded-xl border border-border/30 bg-card p-3 text-left' src/routes/transactions.tsx
          git diff --check
      - name: Commit changes
        run: |
          rm .github/workflows/align-transaction-summary-home.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/transactions.tsx .github/workflows/align-transaction-summary-home.yml
          git commit -m 'style: match transaction summary cards to Home'
          git push
