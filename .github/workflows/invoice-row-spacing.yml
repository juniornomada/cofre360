name: Invoice row spacing

on:
  push:
    paths:
      - 'scripts/patch_invoice_row_spacing.py'
      - '.github/workflows/invoice-row-spacing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python scripts/patch_invoice_row_spacing.py
      - name: Verify source
        run: |
          grep -F 'whitespace-nowrap">· {tx.date}' src/routes/cards.tsx
          grep -F 'ml-1.5 flex items-center gap-1.5 group/card-tx-row' src/routes/cards.tsx
          git diff --check
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/patch_invoice_row_spacing.py .github/workflows/invoice-row-spacing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: improve invoice transaction spacing'
          git push
