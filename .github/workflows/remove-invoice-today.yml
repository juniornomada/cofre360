name: Remove invoice today label

on:
  push:
    paths:
      - "scripts/remove_invoice_today.py"
      - ".github/workflows/remove-invoice-today.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python scripts/remove_invoice_today.py
      - name: Verify source
        run: |
          if grep -n '>hoje<' src/routes/cards.tsx; then
            echo 'today label still present'
            exit 1
          fi
          git diff --check
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/remove_invoice_today.py
          rm .github/workflows/remove-invoice-today.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: remove today label from card invoice month"
          git push
