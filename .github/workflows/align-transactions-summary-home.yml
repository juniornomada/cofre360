name: Align transaction summary with home

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/align-transactions-summary-home.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align summary typography
        shell: bash
        run: |
          sed -i 's/text-base font-bold tabular-nums text-primary/text-base font-bold text-primary/' src/routes/transactions.tsx
          sed -i 's/text-base font-bold tabular-nums text-destructive/text-base font-bold text-destructive/' src/routes/transactions.tsx
      - name: Commit change
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add src/routes/transactions.tsx
          git commit -m 'style: match transaction totals with home'
          git push origin main
      - name: Cleanup
        shell: bash
        run: |
          git rm .github/workflows/align-transactions-summary-home.yml
          git commit -m 'chore: remove transaction summary alignment workflow'
          git push origin main
