name: Fix Insights category period semantics

on:
  push:
    paths:
      - .github/workflows/fix-insights-category-period-semantics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Insights semantics
        run: python .github/scripts/fix_insights_category_period_semantics.py

      - name: Validate patch
        run: |
          grep -F 'Gastos por categoria — compras realizadas no período' supabase/functions/financial-chat/index.ts
          grep -F 'parcelas futuras entram em DESPESAS' supabase/functions/financial-chat/index.ts
          grep -F 'NÃO precisam fechar entre si' supabase/functions/financial-chat/index.ts
          git diff --check

      - name: Commit patch and clean temporary files
        run: |
          rm .github/scripts/fix_insights_category_period_semantics.py
          rm .github/workflows/fix-insights-category-period-semantics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/financial-chat/index.ts .github/scripts/fix_insights_category_period_semantics.py .github/workflows/fix-insights-category-period-semantics.yml
          git commit -m 'fix: separate monthly expenses from category spending in Insights'
          git push
