name: Apply transaction filter hierarchy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reorder-transaction-filters.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply filter hierarchy patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d | python3

      - name: Verify changes
        shell: bash
        run: |
          grep -q 'const monthCategoryRanking' src/routes/transactions.tsx
          grep -q 'Todas + 4 mais usadas no mês + Mais' src/routes/transactions.tsx
          grep -q 'Tipo: Receitas / Despesas' src/routes/transactions.tsx
          ! grep -q 'Gastos por categoria' src/routes/transactions.tsx
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/reorder-transaction-filters.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/transactions.tsx .github/workflows/reorder-transaction-filters.yml
          git commit -m 'feat: reorganize transaction filters by priority'
          git push
