name: Expense category icons only
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 -c "from pathlib import Path; p=Path('src/routes/transactions.tsx'); t=p.read_text(); old='if (tx.is_visible === false) return counts;'; new='if (tx.is_visible === false || tx.type !== \\\"expense\\\") return counts;'; assert old in t; p.write_text(t.replace(old,new,1))"
      - name: Verify
        run: grep -F 'tx.is_visible === false || tx.type !== "expense"' src/routes/transactions.tsx && git diff --check
      - name: Commit
        run: |
          rm .github/workflows/expense-category-icons-only.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/transactions.tsx .github/workflows/expense-category-icons-only.yml
          git commit -m 'fix: show only expense category icons'
          git push
