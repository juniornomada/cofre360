name: Apply card last four edit

on:
  push:
    branches: ["main"]

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python3 .github/scripts/enable_card_last_four_edit.py
      - name: Verify patch
        run: |
          git diff --check
          grep -F 'const [editLastFour, setEditLastFour]' src/routes/cards.tsx
          grep -F 'last_four: normalizedLastFour' src/routes/cards.tsx
          grep -F 'Quatro últimos dígitos do cartão' src/routes/cards.tsx
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-card-last-four-edit.yml .github/scripts/enable_card_last_four_edit.py
          git add src/routes/cards.tsx
          git commit -m 'feat: allow editing card last four digits'
          git push