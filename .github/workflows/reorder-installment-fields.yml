name: Reorder installment fields
on:
  push:
    paths:
      - 'scripts/reorder-installment-fields.py'
      - '.github/workflows/reorder-installment-fields.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python scripts/reorder-installment-fields.py
      - name: Verify order
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/components/QuickAddTransactionDialog.tsx').read_text()
          p=s.index('Parcela atual <span className="text-muted-foreground font-normal">(lançar a partir de)</span>')
          t=s.index('>Total de parcelas</label>', p)
          assert p < t
          PY
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/reorder-installment-fields.py .github/workflows/reorder-installment-fields.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: show current installment before total'
          git push
