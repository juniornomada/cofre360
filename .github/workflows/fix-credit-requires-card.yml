name: Fix credit transaction card requirement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-credit-requires-card.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Require a real card for credit transactions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/transactions.tsx')
          s = p.read_text()

          replacements = [
            (
'''   const handleSaveEdit = async () => {
     if (!editTx) return;
 ''',
'''   const handleSaveEdit = async () => {
     if (!editTx) return;

     const isCreditExpense = editTx.type === "expense" && !editTx.bank_account_id;
     const hasValidCard = !!editTx.card && editTx.card !== "Nenhum";
     if (isCreditExpense && !hasValidCard) {
       toast.error("Selecione o cartão de crédito antes de salvar a transação.");
       return;
     }
 ''',
            ),
            (
'''                    onClick={() => setEditTx({ ...editTx, bank_account_id: null, card: editTx.card || (cardOptions[0]?.name ?? null) })}
                    className={`min-w-0 rounded-xl px-2 py-2 text-[11px] leading-tight font-medium transition-colors ${editTx.card ? "bg-primary text-primary-foreground" : "bg-card text-muted-foreground"}`}
''',
'''                    onClick={() => setEditTx({ ...editTx, bank_account_id: null, card: editTx.card && editTx.card !== "Nenhum" ? editTx.card : "" })}
                    className={`min-w-0 rounded-xl px-2 py-2 text-[11px] leading-tight font-medium transition-colors ${editTx.bank_account_id === null ? "bg-primary text-primary-foreground" : "bg-card text-muted-foreground"}`}
''',
            ),
            (
'''                    {cardOptions.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
''',
'''                    <option value="" disabled>Selecione um cartão</option>
                    {cardOptions.filter(c => c.name !== "Nenhum").map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
''',
            ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected block not found; refusing unsafe patch:\n{old[:160]}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/transactions.tsx
          git commit -m "fix: require card when changing debit to credit"
          git rm .github/workflows/fix-credit-requires-card.yml
          git commit -m "chore: remove credit card requirement hotfix"
          git push origin main
