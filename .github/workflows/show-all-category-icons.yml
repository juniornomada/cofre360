name: Show all category icons

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/show-all-category-icons.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply all-icons category filter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/routes/transactions.tsx')
          s = p.read_text()

          s = s.replace(', FileText, MoreVertical, GripVertical,', ', FileText, GripVertical,')
          s = s.replace('import { DropdownMenu, DropdownMenuContent, DropdownMenuItem, DropdownMenuTrigger } from "@/components/ui/dropdown-menu";\n', '')

          old_defs = '''  const quickCategories4 = monthCategoryRanking.slice(0, 4);\n  const quickCategories5 = monthCategoryRanking.slice(0, 5);\n  const moreCategories4 = monthCategoryRanking.slice(4);\n  const moreCategories5 = monthCategoryRanking.slice(5);\n  const activeCategoryInMore4 = activeCategory !== "Todas" && moreCategories4.some((item) => item.category === activeCategory);\n  const activeCategoryInMore5 = activeCategory !== "Todas" && moreCategories5.some((item) => item.category === activeCategory);\n'''
          if old_defs not in s:
              raise SystemExit('responsive category definitions not found')
          s = s.replace(old_defs, '')

          start_marker = '      {/* 2. Categorias: ícones rápidos; sem filtro ativo = todas */}'
          end_marker = '      {/* 3. Origem: Conta / Cartão */}'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('category block markers not found')

          new_block = '''      {/* 2. Categorias: todas as categorias do mês visíveis por ícone */}\n      {monthCategoryRanking.length > 0 && (\n        <div className="grid grid-cols-6 gap-1.5 sm:grid-cols-8">\n          {monthCategoryRanking.map(({ category }) => {\n            const isActive = activeCategory === category;\n            return (\n              <button\n                key={category}\n                type="button"\n                aria-label={`Filtrar por ${category}`}\n                aria-pressed={isActive}\n                title={category}\n                onClick={() => setActiveCategory(isActive ? "Todas" : category)}\n                className={`interactive-button flex h-9 min-w-0 items-center justify-center rounded-xl border text-base transition-all ${\n                  isActive\n                    ? "border-primary bg-primary text-primary-foreground shadow-sm ring-1 ring-primary/30"\n                    : "border-border/60 bg-card text-foreground hover:bg-accent"\n                }`}\n              >\n                <span aria-hidden="true">{getCategoryIcon(category)}</span>\n              </button>\n            );\n          })}\n        </div>\n      )}\n\n'''
          s = s[:start] + new_block + s[end:]
          p.write_text(s)
          PY

      - name: Verify patch
        shell: bash
        run: |
          grep -q 'todas as categorias do mês visíveis por ícone' src/routes/transactions.tsx
          grep -q 'grid grid-cols-6 gap-1.5 sm:grid-cols-8' src/routes/transactions.tsx
          ! grep -q 'quickCategories4' src/routes/transactions.tsx
          ! grep -q 'moreCategories5' src/routes/transactions.tsx
          ! grep -q 'DropdownMenu' src/routes/transactions.tsx
          git diff --check

      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/show-all-category-icons.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/transactions.tsx .github/workflows/show-all-category-icons.yml
          git commit -m 'feat: show all monthly categories as icons'
          git push
