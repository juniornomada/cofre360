jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply edit dialog alignment
        run: echo ' gZGlhbG9nX3N0YXJ0KQoKbmV3X2RpYWxvZ19vcGVuID0gJycnICAgICAgICA8RGlhbG9nQ29udGVudCBjbGFzc05hbWU9InctW2NhbGMoMTAwZHZ3LTI0cHgpXSBtYXgtdy1bY2FsYygxMDBkdnc tMjRweCldIGgtW2NhbGMoMTAwZHZ oLTI0cHgpXSBtYXgtaC1bY2FsYygxMDBkdmg tMjRweCldIG1pbi1oLTAgcm91bmRlZC0yeGwgYmctYmFja2dyb3VuZCBvdmVyZmxvdy1oaWRkZW4gcC0wIGdhcC0wIGZsZXggZmxleC1jb2wgc206aC1hdXRvIHNtOm1heC1oLVs4OGR2aF0gc206bWluLWgtWzY0MHB4XSBzbTohdy1bMjhyZW1dIHNtOiFtYXgtdy1bMjhyZW1dIj4KJycnCnRleHQgPSB0ZXh0Wzpk    gZmxleCBmbGV4LWNvbCBpdGVtcy1jZW50ZXIgZ2FwLTAuNSByb3VuZGVkLWxnIHAtMS41IHRyYW5zaXRpb24tYWxsICR7CiAgICAgICAgICAgICAgICAgICAgICA   ' | base64 -d | python3
      - name: Verify changes
        run: |
          grep -q 'Conta Débito/Pix' src/routes/transactions.tsx
          grep -q 'Cartão de crédito' src/routes/transactions.tsx
          grep -q 'defaultExpanded={true}' src/routes/transactions.tsx
          grep -q 'CreditCard className="h-3 w-3"' src/routes/transactions.tsx
          git diff --check
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/align-edit-quickadd.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/transactions.tsx .github/workflows/align-edit-quickadd.yml
          git commit -m "style: align transaction editor with quick add"
          git push
