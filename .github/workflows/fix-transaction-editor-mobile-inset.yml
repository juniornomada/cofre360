name: Simplify transaction month navigator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-transaction-editor-mobile-inset.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove period label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/transactions.tsx')
          s = p.read_text()
          old = '''        <div className="min-w-0 text-center">\n          <p className="text-[10px] font-medium uppercase tracking-[0.12em] text-muted-foreground">Período</p>\n          <p className="truncate text-sm font-bold text-foreground">{selectedMonthLabel}</p>\n        </div>'''
          new = '''        <div className="min-w-0 text-center">\n          <p className="truncate text-base font-bold text-foreground">{selectedMonthLabel}</p>\n        </div>'''
          if old not in s:
              raise SystemExit('month navigator target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/transactions.tsx
          git commit -m "style: remove period label from transaction month navigation"
          git rm .github/workflows/fix-transaction-editor-mobile-inset.yml
          git commit -m "chore: remove transaction month cleanup workflow"
          git push origin main
