name: Apply visual bank picker
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-mobile-edit-no-x-transform.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply visual bank picker patch
        run: python3 scripts/patch_visual_bank_picker.py
      - name: Verify, commit and cleanup
        run: |
          grep -q 'Selecione a conta bancária antes de salvar a transação.' src/routes/transactions.tsx
          grep -q 'Nenhuma conta cadastrada.' src/routes/transactions.tsx
          grep -q 'select("id, name, balance, icon, color")' src/routes/transactions.tsx
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/transactions.tsx
          git rm scripts/patch_visual_bank_picker.py
          git rm .github/workflows/hotfix-mobile-edit-no-x-transform.yml
          git commit -m "feat: use visual bank picker in transaction editor"
          git push origin main
