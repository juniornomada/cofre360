name: Add home category spending

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-home-category-spending.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/add_home_category_spending.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/home.tsx
          git commit -m "feat: show monthly spending by category on home"
          git rm .github/workflows/add-home-category-spending.yml scripts/add_home_category_spending.py
          git commit -m "chore: remove home category spending patch files"
          git push origin main
