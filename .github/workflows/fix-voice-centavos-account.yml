name: Fix voice centavos and account matching

on:
  push:
    branches: ["main"]

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch voice parser and account matching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          voice = Path('src/lib/voice-transaction.ts')
          s = voice.read_text(encoding='utf-8')

          anchor = '    .toLowerCase();\n\nconst NUMBER_WORD_VALUES'
          helper = '    .toLowerCase();\n\nexport const normalizeVoiceAccountReference = (value: string) =>\n  normalize(value)\n    .replace(/\\bpor cento\\b/g, "")\n    .replace(/%/g, "")\n    .replace(/[^a-z0-9]+/g, " ")\n    .replace(/\\s+/g, " ")\n    .trim();\n\nexport const voiceAccountNamesMatch = (spoken: string, saved: string) =>\n  normalizeVoiceAccountReference(spoken) === normalizeVoiceAccountReference(saved);\n\nconst NUMBER_WORD_VALUES'
          if anchor not in s:
              raise SystemExit('normalize helper anchor not found')
          s = s.replace(anchor, helper, 1)

          amount_anchor = 'function parseAmount(text: string): number {\n  // Expressões monetárias explícitas têm prioridade'
          cents = 'function parseAmount(text: string): number {\n  // Centavos isolados têm prioridade para que "31 centavos" vire R$ 0,31.\n  const numericCents = text.match(/\\b(?:(?:no\\s+valor\\s+de|valor\\s+de|valor|por)\\s*(?:[,;:=\\-]\\s*)?)?(\\d{1,2})\\s+centavos?\\b/i);\n  if (numericCents) return Number(numericCents[1]) / 100;\n\n  const wordCents = text.match(new RegExp(`\\\\b(?:(?:no\\\\s+valor\\\\s+de|valor\\\\s+de|valor|por)\\\\s*(?:[,;:=\\\\-]\\\\s*)?)?(${NUMBER_WORD_SEQUENCE})\\\\s+centavos?\\\\b`, "i"));\n  if (wordCents) {\n    const centsValue = parsePortugueseNumberWords(wordCents[1]);\n    if (centsValue !== null && centsValue >= 0 && centsValue < 100) return centsValue / 100;\n  }\n\n  // Expressões monetárias explícitas têm prioridade'
          if amount_anchor not in s:
              raise SystemExit('parseAmount anchor not found')
          s = s.replace(amount_anchor, cents, 1)

          old_value = '|| text.match(/\\b(?:no\\s+valor\\s+de|valor\\s+de|valor)\\s+(\\d{1,3}(?:\\.\\d{3})+(?:,\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)/i);'
          new_value = '|| text.match(/\\b(?:no\\s+valor\\s+de|valor\\s+de|valor)\\s*(?:[,;:=\\-]\\s*)?(\\d{1,3}(?:\\.\\d{3})+(?:,\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)/i);'
          if old_value not in s:
              raise SystemExit('numeric value pattern not found')
          s = s.replace(old_value, new_value, 1)

          old_account = '`\\\\bconta(?:\\\\s+banc[aá]ria)?\\\\s+(?:(?:do|da|de)\\\\s+)?(.+?)(?=\\\\s+(?:${METADATA_BOUNDARY})|[,.]|$)`'
          new_account = '`\\\\bconta(?:\\\\s+banc[aá]ria)?\\\\s*(?:[,;:=\\\\-]\\\\s*)?(?:(?:do|da|de)\\\\s+)?(.+?)(?=\\\\s+(?:${METADATA_BOUNDARY})|[,.]|$)`'
          if old_account not in s:
              raise SystemExit('bank account pattern not found')
          s = s.replace(old_account, new_account, 1)
          voice.write_text(s, encoding='utf-8')

          quick = Path('src/components/QuickAddTransactionDialog.tsx')
          q = quick.read_text(encoding='utf-8')
          old_import = 'import type { VoiceTransactionDraft } from "@/lib/voice-transaction";'
          new_import = 'import { voiceAccountNamesMatch, type VoiceTransactionDraft } from "@/lib/voice-transaction";'
          if old_import not in q:
              raise SystemExit('QuickAdd voice import not found')
          q = q.replace(old_import, new_import, 1)

          effect_re = re.compile(r'  useEffect\(\(\) => \{\n    if \(!open \|\| !initialDraft\?\.bankAccount \|\| bankAccounts\.length === 0\) return;\n    const normalizeAccountName = \(value: string\) => value.*?  \}, \[open, initialDraft\?\.bankAccount, bankAccounts, newTx\.bank_account_id\]\);', re.S)
          new_effect = '  useEffect(() => {\n    if (!open || !initialDraft?.bankAccount || bankAccounts.length === 0) return;\n    const spokenAccount = initialDraft.bankAccount;\n    const match = bankAccounts.find(account => voiceAccountNamesMatch(spokenAccount, account.name));\n    if (!match || newTx.bank_account_id === match.id) return;\n    setNewTx(prev => ({ ...prev, bank_account_id: match.id, card: null }));\n  }, [open, initialDraft?.bankAccount, bankAccounts, newTx.bank_account_id]);'
          q, count = effect_re.subn(new_effect, q, count=1)
          if count != 1:
              raise SystemExit(f'account matching effect replacement count={count}')
          quick.write_text(q, encoding='utf-8')

          tests = Path('src/lib/__tests__/voice-transaction.test.ts')
          t = tests.read_text(encoding='utf-8')
          t = t.replace('import { parseVoiceTransaction } from "@/lib/voice-transaction";', 'import { parseVoiceTransaction, voiceAccountNamesMatch } from "@/lib/voice-transaction";', 1)
          insert = '\n\n  it("entende 31 centavos como R$ 0,31 em comando estruturado", () => {\n    const draft = parseVoiceTransaction("Receita, nome, rendimento, valor, 31 centavos, conta, Cofrinho 140", now);\n    expect(draft.type).toBe("income");\n    expect(draft.name).toBe("Rendimento");\n    expect(draft.category).toBe("Receita > Juros");\n    expect(draft.amount).toBe(0.31);\n    expect(draft.bankAccount).toBe("Cofrinho 140");\n  });\n\n  it("aceita 0.31 e 0,31 como o mesmo valor", () => {\n    expect(parseVoiceTransaction("Receita nome rendimento valor 0.31 conta Cofrinho 140", now).amount).toBe(0.31);\n    expect(parseVoiceTransaction("Receita nome rendimento valor 0,31 conta Cofrinho 140%", now).amount).toBe(0.31);\n  });\n\n  it("considera Cofrinho 140 e Cofrinho 140% a mesma conta", () => {\n    expect(voiceAccountNamesMatch("Cofrinho 140", "Cofrinho 140%")).toBe(true);\n    expect(voiceAccountNamesMatch("Cofrinho 140 por cento", "Cofrinho 140%")).toBe(true);\n  });'
          close = t.rfind('\n});')
          if close < 0:
              raise SystemExit('test closing not found')
          t = t[:close] + insert + t[close:]
          tests.write_text(t, encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          git diff --check
          grep -F 'numericCents' src/lib/voice-transaction.ts
          grep -F 'voiceAccountNamesMatch' src/lib/voice-transaction.ts
          grep -F 'voiceAccountNamesMatch(spokenAccount, account.name)' src/components/QuickAddTransactionDialog.tsx
          grep -F '31 centavos' src/lib/__tests__/voice-transaction.test.ts
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-voice-centavos-account.yml
          git add src/lib/voice-transaction.ts src/components/QuickAddTransactionDialog.tsx src/lib/__tests__/voice-transaction.test.ts
          git commit -m 'fix: parse voice centavos and match account percentage'
          git push
