name: Apply short transaction date display

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-responsive-transaction-editor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply short-date list patch
        run: python3 scripts/patch_short_date_lists.py
      - name: Commit patch and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/home.tsx src/components/TransactionItem.tsx src/components/QuickAddTransactionDialog.tsx
          git rm scripts/patch_short_date_lists.py .github/workflows/apply-responsive-transaction-editor.yml
          git commit -m "fix: use short dates in lists and full dates in forms"
          git push origin main
