name: Apply transaction date format patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-responsive-transaction-editor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply date format patch
        run: python3 scripts/patch_date_display_ddmmyyyy.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/accounts.tsx src/routes/home.tsx src/routes/transactions.tsx src/components/TransactionItem.tsx
          git rm scripts/patch_date_display_ddmmyyyy.py
          git commit -m "fix: standardize transaction dates as dd-MM-yyyy"
          git push origin main
