name: Align editor payment selection

on:
  push:
    paths:
      - '.github/workflows/align-edit-payment-selection.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply patch
        run: python3 scripts/align-edit-payment-selection.py
      - name: Verify source
        run: |
          ! grep -q '>Nenhuma<' src/routes/transactions.tsx
          ! grep -q '>Nenhum<' src/routes/transactions.tsx
          grep -q 'Selecione uma conta ou um cartão antes de salvar a transação' src/routes/transactions.tsx
          grep -q 'Toque novamente no selecionado para desmarcar' src/routes/transactions.tsx
          git diff --check
      - name: Build
        run: bun run build
      - name: Cleanup and commit
        run: |
          rm scripts/align-edit-payment-selection.py
          rm .github/workflows/align-edit-payment-selection.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: align editor payment selection with quick add'
          git push
