name: Fix investment allocation tooltip

on:
  push:
    paths:
      - '.github/workflows/fix-invest-tooltip.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch investment allocation tooltip
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/invest.tsx')
          text = path.read_text()
          marker = 'formatter={(v: any) => balanceVisible ? fmtBRL(Number(v)) : "R$ ••••"}'
          marker_index = text.find(marker)
          if marker_index < 0:
              raise SystemExit('Tooltip formatter marker not found; source changed and was not patched.')
          start = text.rfind('<RTooltip', 0, marker_index)
          end = text.find('/>', marker_index)
          if start < 0 or end < 0:
              raise SystemExit('Tooltip block bounds not found.')
          end += 2
          new = '''<RTooltip
                  cursor={false}
                  allowEscapeViewBox={{ x: false, y: false }}
                  offset={10}
                  wrapperStyle={{ zIndex: 20, pointerEvents: "none" }}
                  content={({ active, payload }) => {
                    if (!active || !payload?.length) return null;
                    const item = payload[0]?.payload as { name?: string; value?: number; color?: string } | undefined;
                    const value = Number(item?.value ?? 0);
                    const pct = totalGross > 0 ? (value / totalGross) * 100 : 0;
                    return (
                      <div className="max-w-[190px] rounded-xl border border-border bg-popover px-3 py-2 shadow-lg">
                        <div className="flex min-w-0 items-center gap-1.5">
                          <span
                            className="h-2.5 w-2.5 shrink-0 rounded-full"
                            style={{ backgroundColor: item?.color || "hsl(var(--primary))" }}
                          />
                          <p className="min-w-0 truncate text-[10px] font-medium text-popover-foreground">
                            {item?.name || "Investimento"}
                          </p>
                        </div>
                        <p className="mt-1 whitespace-nowrap text-xs font-bold tabular-nums text-popover-foreground">
                          {balanceVisible
                            ? `${fmtBRL(value)} • ${pct.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 })}%`
                            : "R$ ••••"}
                        </p>
                      </div>
                    );
                  }}
                />'''
          path.write_text(text[:start] + new + text[end:])
          Path('.github/workflows/fix-invest-tooltip.yml').unlink()
          PY
      - name: Commit direct source fix
        shell: bash
        run: |
          git config user.name "cofre360-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/invest.tsx .github/workflows/fix-invest-tooltip.yml
          git commit -m "fix: keep investment allocation tooltip readable"
          git push
