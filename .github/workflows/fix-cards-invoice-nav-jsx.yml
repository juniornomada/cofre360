name: Fix cards invoice JSX
on:
  push:
    paths:
      - .github/scripts/fix-cards-invoice-nav-jsx.py
      - .github/workflows/fix-cards-invoice-nav-jsx.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply fix
        run: python3 .github/scripts/fix-cards-invoice-nav-jsx.py
      - name: Verify source
        run: |
          ! grep -F 'data-testid={`period-tab-${period.key}`}' src/routes/cards.tsx
          git diff --check
      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Cleanup and commit
        run: |
          rm .github/scripts/fix-cards-invoice-nav-jsx.py
          rm .github/workflows/fix-cards-invoice-nav-jsx.yml
          rm -f .github/workflows/verify-account-hierarchy-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/cards.tsx .github/scripts/fix-cards-invoice-nav-jsx.py .github/workflows/fix-cards-invoice-nav-jsx.yml .github/workflows/verify-account-hierarchy-build.yml
          git commit -m 'fix: remove stale invoice navigation JSX'
          git push