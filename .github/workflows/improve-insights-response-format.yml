name: Improve Insights response format

on:
  push:
    paths:
      - .github/workflows/improve-insights-response-format.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch financial chat prompt
        shell: bash
        run: |
          echo '' | base64 -d | python3

      - name: Validate patch
        run: |
          git diff --check
          grep -F 'Padrão visual obrigatório das respostas:' supabase/functions/financial-chat/index.ts
          grep -F '🛒 Supermercado' supabase/functions/financial-chat/index.ts
          grep -F '💡 **Insight:**' supabase/functions/financial-chat/index.ts

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/improve-insights-response-format.yml
          git add supabase/functions/financial-chat/index.ts
          git commit -m "feat: improve AI Insights response formatting"
          git push
