project_id = "bllqvpnjfpcvujrbrbig"

[auth]
enable_signup = true
enable_email_signup = true
enable_email_confirmations = true

[functions.financial-chat]
verify_jwt = true

[functions.run-ai-tests]
verify_jwt = true

[functions.validate-agreement]
verify_jwt = true

[functions.transcribe-voice]
verify_jwt = true

# External integrations authenticate with COFRE360_EXTERNAL_API_TOKEN.
# JWT verification is disabled here because callers such as ChatGPT do not
# have the user's Supabase session token. The function itself validates its
# dedicated bearer token before using the service-role client.
[functions.external-transactions]
verify_jwt = false

# Scheduled reconciliation authenticates with a dedicated bearer secret stored
# in Supabase Vault, so the gateway JWT check is intentionally disabled.
[functions.reconciliation-daily]
verify_jwt = false
